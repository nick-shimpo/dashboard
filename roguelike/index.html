<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Roguelike</title>
<link rel="manifest" href="manifest.json">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: manipulation;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
#ui-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}
#hp-bar {
  position: fixed;
  top: env(safe-area-inset-top, 8px);
  left: 8px; right: 8px;
  height: 6px;
  background: #333;
  border-radius: 3px;
  z-index: 20;
  pointer-events: none;
}
#hp-fill {
  height: 100%;
  background: #4a2;
  border-radius: 3px;
  transition: width 0.3s;
}
#status-bar {
  position: fixed;
  top: calc(env(safe-area-inset-top, 8px) + 10px);
  left: 12px; right: 12px;
  color: #ccc;
  font: bold 11px monospace;
  z-index: 20;
  pointer-events: none;
  display: flex;
  justify-content: space-between;
}
#tile-board-btn {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 8px) + 8px);
  right: 12px;
  width: 44px; height: 44px;
  background: rgba(60,60,80,0.8);
  border: 1px solid #666;
  border-radius: 8px;
  color: #fff;
  font: bold 18px monospace;
  z-index: 20;
  pointer-events: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}
#held-tile {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 8px) + 8px);
  left: 12px;
  background: rgba(20,30,50,0.9);
  border: 1px solid #4af;
  border-radius: 6px;
  color: #8cf;
  font: 12px monospace;
  z-index: 20;
  pointer-events: auto;
  padding: 6px 10px;
  display: none;
  align-items: center;
  gap: 6px;
  max-width: 200px;
}
#held-tile.has-tile { display: flex; }
#held-tile .held-icon { font-size: 20px; }
#held-tile .held-name { color: #cdf; font-weight: bold; font-size: 11px; }
#held-tile .held-hint { color: #668; font-size: 10px; }
#log {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 8px) + 60px);
  left: 8px; right: 8px;
  color: #ddd;
  font: 11px monospace;
  z-index: 20;
  pointer-events: none;
  text-shadow: 0 0 3px #000, 0 0 6px #000;
  max-height: 60px;
  overflow: hidden;
}
.log-line { opacity: 0.7; }
.log-line:last-child { opacity: 1; }

/* ── Panel Overlay ── */
#panel-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.75);
  z-index: 30;
  display: none;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
}
#panel-overlay.open { display: flex; }

#panel {
  width: min(340px, 90vw);
  background: #0c0c12;
  border: 2px solid #64646e;
  border-radius: 4px;
  font: 14px/1.4 monospace;
  color: #b4b4b8;
  padding: 0;
  max-height: 80vh;
  overflow-y: auto;
}

/* ── Tab Bar ── */
#panel-tabs {
  display: flex;
  border-bottom: 1px solid #64646e;
}
.panel-tab {
  flex: 1;
  padding: 10px 0;
  text-align: center;
  color: #646470;
  background: none;
  border: none;
  font: bold 13px monospace;
  letter-spacing: 1px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.panel-tab.active {
  color: #c8c8d0;
  border-bottom: 2px solid #c8c8d0;
}

/* ── Tab Content ── */
.tab-content { display: none; padding: 12px; }
.tab-content.active { display: block; }

/* ── Equipment Slots ── */
.equip-slot {
  border: 1px solid #3c3c4e;
  border-radius: 3px;
  padding: 8px 10px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.equip-slot .slot-icon {
  font-size: 20px;
  width: 28px;
  text-align: center;
  color: #8888a0;
}
.equip-slot .slot-info { flex: 1; }
.equip-slot .slot-label {
  font-size: 10px;
  color: #5a5a6e;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.equip-slot .slot-name {
  color: #c8c8d0;
  font-size: 13px;
}
.equip-slot .slot-stats {
  font-size: 11px;
  color: #7a7a8e;
}

/* ── Tile Board Grid ── */
.tile-board-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  max-width: 260px;
  margin: 8px auto;
}
.board-cell {
  aspect-ratio: 1;
  border: 1px dashed #3c3c4e;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  color: #2a2a3a;
  background: #10101a;
  position: relative;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.board-cell.filled {
  border-style: solid;
  border-color: #64646e;
  color: #c8c8d0;
  background: #1a1a28;
}
.board-cell.powered {
  border-color: #4af;
  background: #1a2040;
  box-shadow: 0 0 6px rgba(68,170,255,0.3);
}
.board-cell.placeable {
  border-color: #4a4;
  border-style: dashed;
  animation: pulse-border 1.2s infinite;
}
@keyframes pulse-border {
  0%, 100% { border-color: #4a4; }
  50% { border-color: #8f8; }
}
.board-cell .cell-label {
  position: absolute;
  top: 2px; left: 4px;
  font-size: 9px;
  color: #3c3c4e;
}
.board-cell .cell-name {
  position: absolute;
  bottom: 2px;
  font-size: 8px;
  color: #666;
  width: 100%;
  text-align: center;
  overflow: hidden;
  white-space: nowrap;
}
/* Connector dots on board cells */
.connector { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #555; }
.connector.active { background: #4af; }
.connector.connected { background: #4f4; }
.connector.top { top: 1px; left: 50%; transform: translateX(-50%); }
.connector.right { right: 1px; top: 50%; transform: translateY(-50%); }
.connector.bottom { bottom: 1px; left: 50%; transform: translateX(-50%); }
.connector.left { left: 1px; top: 50%; transform: translateY(-50%); }
.board-status {
  text-align: center;
  font-size: 11px;
  color: #5a5a6e;
  margin-top: 8px;
}
.tile-detail {
  margin-top: 10px;
  padding: 8px;
  border: 1px solid #3c3c4e;
  border-radius: 3px;
  background: #10101a;
  font-size: 11px;
}
.tile-detail .td-name { color: #cdf; font-weight: bold; font-size: 13px; margin-bottom: 4px; }
.tile-detail .td-type { color: #668; font-size: 10px; text-transform: uppercase; }
.tile-detail .td-ability { color: #aab; margin: 4px 0; }
.tile-detail .td-powered { color: #4af; margin: 4px 0; }
.tile-detail .td-duo { color: #fa4; margin: 4px 0; font-style: italic; }
.held-preview {
  margin-top: 10px;
  padding: 8px;
  border: 1px solid #4af;
  border-radius: 3px;
  background: #0c1020;
  font-size: 11px;
}
.held-preview .hp-label { color: #4af; font-weight: bold; font-size: 12px; margin-bottom: 4px; }
.held-preview .hp-ability { color: #aab; }
.held-preview .hp-connectors { color: #668; font-size: 10px; margin-top: 4px; }

/* ── Close Button ── */
#panel-close {
  position: absolute;
  top: 8px; right: 12px;
  background: none;
  border: none;
  color: #646470;
  font: bold 18px monospace;
  cursor: pointer;
  z-index: 31;
  -webkit-tap-highlight-color: transparent;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div>
<div id="status-bar">
  <span id="depth-label">Depth 1</span>
  <span id="equip-label"></span>
</div>
<div id="log"></div>
<div id="held-tile">
  <span class="held-icon"></span>
  <div>
    <div class="held-name"></div>
    <div class="held-hint">Tap BOARD to place</div>
  </div>
</div>
<div id="tile-board-btn">&#9638;</div>

<div id="panel-overlay">
  <div id="panel" style="position:relative;">
    <button id="panel-close">&times;</button>
    <div id="panel-tabs">
      <button class="panel-tab active" data-tab="equip">EQUIP</button>
      <button class="panel-tab" data-tab="board">BOARD</button>
    </div>
    <div id="tab-equip" class="tab-content active">
      <div id="equip-weapon" class="equip-slot">
        <div class="slot-icon">&#9876;</div>
        <div class="slot-info">
          <div class="slot-label">Weapon</div>
          <div class="slot-name">—</div>
          <div class="slot-stats"></div>
        </div>
      </div>
      <div id="equip-armor" class="equip-slot">
        <div class="slot-icon">&#128737;</div>
        <div class="slot-info">
          <div class="slot-label">Armor</div>
          <div class="slot-name">—</div>
          <div class="slot-stats"></div>
        </div>
      </div>
      <div style="border-top:1px solid #3c3c4e; margin:12px 0 8px; padding-top:10px;">
        <div style="font-size:11px; color:#5a5a6e; margin-bottom:6px;">STATS</div>
        <div id="stats-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; font-size:12px;">
          <div>&#9829; HP: <span id="stat-hp"></span></div>
          <div>&#9733; STR: <span id="stat-str"></span></div>
          <div>&#9876; ATK: <span id="stat-atk"></span></div>
          <div>&#128737; DEF: <span id="stat-def"></span></div>
          <div>&#9670; LVL: <span id="stat-lvl"></span></div>
          <div>&#9672; XP: <span id="stat-xp"></span></div>
        </div>
      </div>
    </div>
    <div id="tab-board" class="tab-content">
      <div class="tile-board-grid">
        <div class="board-cell" data-slot="0"><span class="cell-label">1</span>&#183;</div>
        <div class="board-cell" data-slot="1"><span class="cell-label">2</span>&#183;</div>
        <div class="board-cell" data-slot="2"><span class="cell-label">3</span>&#183;</div>
        <div class="board-cell" data-slot="3"><span class="cell-label">4</span>&#183;</div>
        <div class="board-cell" data-slot="4"><span class="cell-label">5</span>&#183;</div>
        <div class="board-cell" data-slot="5"><span class="cell-label">6</span>&#183;</div>
        <div class="board-cell" data-slot="6"><span class="cell-label">7</span>&#183;</div>
        <div class="board-cell" data-slot="7"><span class="cell-label">8</span>&#183;</div>
        <div class="board-cell" data-slot="8"><span class="cell-label">9</span>&#183;</div>
      </div>
      <div class="board-status">No tiles placed yet. Find tiles in the dungeon.</div>
    </div>
  </div>
</div>

<script>
// ============================================================
// ROGUELIKE — Web/PWA Foundation
// SPD-inspired dungeon crawler with tile board build system
// Combat math, enemies, and equipment ported from SPD source
// ============================================================

// --- Constants ---
const TILE = 16;
const MAP_W = 32;
const MAP_H = 32;

// --- Terrain types ---
const T = {
  WALL: 0, DOOR: 1, OPEN_DOOR: 2, EMPTY: 3, GRASS: 4,
  HIGH_GRASS: 5, WATER: 6, WALL_DECO: 7, ENTRANCE: 8, EXIT: 9,
  BOOKSHELF: 10, BARRICADE: 11, EMBERS: 12, PEDESTAL: 13,
  SECRET_DOOR: 14, TRAP: 15,
};
const PASSABLE = new Set([T.EMPTY, T.GRASS, T.HIGH_GRASS, T.WATER, T.DOOR, T.OPEN_DOOR, T.ENTRANCE, T.EXIT, T.EMBERS, T.TRAP]);
const BLOCKS_VISION = new Set([T.WALL, T.WALL_DECO, T.BOOKSHELF, T.BARRICADE, T.SECRET_DOOR]);

const TILE_COLORS = {
  [T.WALL]: '#444455', [T.DOOR]: '#8B6914', [T.OPEN_DOOR]: '#6B4914',
  [T.EMPTY]: '#2a2a3a', [T.GRASS]: '#1a3a1a', [T.HIGH_GRASS]: '#2a5a2a',
  [T.WATER]: '#1a2a4a', [T.WALL_DECO]: '#555566', [T.ENTRANCE]: '#2a4a2a',
  [T.EXIT]: '#4a2a2a', [T.BOOKSHELF]: '#5a4020', [T.BARRICADE]: '#6a5030',
  [T.EMBERS]: '#3a2020', [T.PEDESTAL]: '#3a3a4a', [T.SECRET_DOOR]: '#444455',
  [T.TRAP]: '#3a2a2a',
};

// ============================================================
// SPD COMBAT MATH (ported from Char.java, MeleeWeapon.java, Armor.java)
// ============================================================

// Bell-curve integer range (SPD's Random.NormalIntRange)
function normalIntRange(min, max) {
  return Math.round((Math.random() + Math.random()) * (max - min) / 2 + min);
}

// SPD hit resolution: Random.Float(accuracy) >= Random.Float(evasion)
function resolveHit(accuracy, evasion) {
  return Math.random() * accuracy >= Math.random() * evasion;
}

// ============================================================
// EQUIPMENT SYSTEM (from SPD's MeleeWeapon.java, Armor.java)
// ============================================================

// Weapon: tier determines base stats
// min(lvl) = tier + lvl
// max(lvl) = 5*(tier+1) + lvl*(tier+1)
// STRReq(lvl) = (8 + tier*2) - floor((sqrt(8*lvl+1)-1)/2)
function makeWeapon(name, tier, level = 0) {
  const strReq = Math.max(1, (8 + tier * 2) - Math.floor((Math.sqrt(8 * level + 1) - 1) / 2));
  return {
    name, tier, level,
    minDmg: tier + level,
    maxDmg: 5 * (tier + 1) + level * (tier + 1),
    strReq,
    acc: 1.0,
    dly: 1.0,
  };
}

// Armor: tier determines DR
// DRMax(lvl) = tier * (2 + lvl)
// DRMin(lvl) = lvl (when lvl < DRMax)
// STRReq same formula as weapons
function makeArmor(name, tier, level = 0) {
  const strReq = Math.max(1, (8 + Math.round(tier * 2)) - Math.floor((Math.sqrt(8 * level + 1) - 1) / 2));
  const drMax = tier * (2 + level);
  const drMin = level < drMax ? level : level - drMax;
  return {
    name, tier, level,
    drMin,
    drMax,
    strReq,
  };
}

function weaponDamageRoll(weapon, heroStr) {
  let dmg = normalIntRange(weapon.minDmg, weapon.maxDmg);
  const excessStr = heroStr - weapon.strReq;
  if (excessStr > 0) {
    dmg += normalIntRange(0, excessStr);
  }
  return Math.max(0, dmg);
}

function armorDR(armor) {
  return normalIntRange(armor.drMin, armor.drMax);
}

// ============================================================
// SEWERS MOB DEFINITIONS (from SPD source)
// ============================================================

const MOB_DEFS = {
  rat:      { hp: 8,  atkSkill: 8,  defSkill: 2,  minDmg: 1, maxDmg: 4, dr: 1,  xp: 1, speed: 1.0 },
  snake:    { hp: 4,  atkSkill: 10, defSkill: 25, minDmg: 1, maxDmg: 4, dr: 0,  xp: 2, speed: 1.0 },
  gnoll:    { hp: 12, atkSkill: 10, defSkill: 4,  minDmg: 1, maxDmg: 6, dr: 2,  xp: 2, speed: 1.0 },
  crab:     { hp: 15, atkSkill: 12, defSkill: 5,  minDmg: 1, maxDmg: 7, dr: 4,  xp: 4, speed: 2.0 },
  skeleton: { hp: 20, atkSkill: 12, defSkill: 5,  minDmg: 2, maxDmg: 5, dr: 0,  xp: 4, speed: 1.0 },
};

// Spawn tables per depth (from SPD's MobSpawner.java)
const SPAWN_TABLE = {
  1: ['rat', 'rat', 'rat', 'snake'],
  2: ['rat', 'rat', 'snake', 'gnoll', 'gnoll'],
  3: ['rat', 'snake', 'gnoll', 'gnoll', 'gnoll', 'crab'],
  4: ['gnoll', 'crab', 'crab', 'skeleton'],
  5: ['gnoll', 'crab', 'crab', 'skeleton', 'skeleton'],
};

function spawnMobType(depth) {
  const table = SPAWN_TABLE[Math.min(depth, 5)];
  return table[Math.floor(Math.random() * table.length)];
}

function createMob(type, x, y) {
  const def = MOB_DEFS[type];
  return {
    x, y,
    name: type,
    hp: def.hp,
    maxHp: def.hp,
    atkSkill: def.atkSkill,
    defSkill: def.defSkill,
    minDmg: def.minDmg,
    maxDmg: def.maxDmg,
    dr: def.dr,
    xp: def.xp,
    speed: def.speed,
    actTimer: 0, // for speed system
  };
}

// ============================================================
// GAME STATE
// ============================================================

const state = {
  map: new Uint8Array(MAP_W * MAP_H),
  visible: new Uint8Array(MAP_W * MAP_H),
  explored: new Uint8Array(MAP_W * MAP_H),
  player: {
    x: 0, y: 0,
    hp: 20, maxHp: 20,
    str: 10,
    atkSkill: 10,
    defSkill: 5,
    xp: 0,
    level: 1,
    weapon: null,
    armor: null,
  },
  mobs: [],
  depth: 1,
  turn: 0,
  camera: { x: 0, y: 0 },
  scale: 3,
  log: [],
  rooms: [],
  autoWalkPath: null,
  autoWalkTimer: null,
};

// --- Canvas Setup ---
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  state.scale = Math.max(2, Math.floor(canvas.width / (TILE * 12)));
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- Utility ---
function idx(x, y) { return y * MAP_W + x; }
function toXY(i) { return { x: i % MAP_W, y: Math.floor(i / MAP_W) }; }
function dist(x1, y1, x2, y2) { return Math.abs(x1 - x2) + Math.abs(y1 - y2); }
function rng(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// --- Logging ---
function log(msg) {
  state.log.push(msg);
  if (state.log.length > 4) state.log.shift();
  const el = document.getElementById('log');
  el.innerHTML = state.log.map(l => `<div class="log-line">${l}</div>`).join('');
}

// ============================================================
// DUNGEON GENERATION (SPD-tuned: 5-7 rooms, Sewers feel)
// ============================================================

function generateLevel() {
  const map = state.map;
  map.fill(T.WALL);
  state.rooms = [];
  state.mobs = [];
  state.visible.fill(0);
  state.explored.fill(0);

  // SPD Sewers: 4-6 standard rooms + entrance/exit
  const roomCount = rng(5, 7);
  const rooms = [];

  for (let attempt = 0; attempt < 200 && rooms.length < roomCount; attempt++) {
    const w = rng(4, 8);
    const h = rng(4, 8);
    const x = rng(1, MAP_W - w - 2);
    const y = rng(1, MAP_H - h - 2);

    let overlaps = false;
    for (const r of rooms) {
      if (x - 1 < r.x + r.w && x + w + 1 > r.x &&
          y - 1 < r.y + r.h && y + h + 1 > r.y) {
        overlaps = true;
        break;
      }
    }
    if (!overlaps) {
      rooms.push({ x, y, w, h, cx: Math.floor(x + w/2), cy: Math.floor(y + h/2) });
    }
  }

  // Carve rooms
  for (const r of rooms) {
    for (let ry = r.y; ry < r.y + r.h; ry++) {
      for (let rx = r.x; rx < r.x + r.w; rx++) {
        map[idx(rx, ry)] = T.EMPTY;
      }
    }
  }

  // Connect rooms (nearest neighbor chain)
  const connected = [rooms[0]];
  const remaining = rooms.slice(1);
  while (remaining.length > 0) {
    let bestDist = Infinity, bestC = null, bestR = null, bestRI = -1;
    for (const c of connected) {
      for (let i = 0; i < remaining.length; i++) {
        const d = dist(c.cx, c.cy, remaining[i].cx, remaining[i].cy);
        if (d < bestDist) { bestDist = d; bestC = c; bestR = remaining[i]; bestRI = i; }
      }
    }
    carveCorridor(map, bestC.cx, bestC.cy, bestR.cx, bestR.cy);
    connected.push(remaining.splice(bestRI, 1)[0]);
  }

  // Doors
  for (const r of rooms) placeDoors(map, r);

  // Sewers terrain: 30% water, 20% grass (from SPD SewerPainter)
  for (let i = 0; i < map.length; i++) {
    if (map[i] === T.EMPTY) {
      const roll = Math.random();
      if (roll < 0.06) map[i] = T.WATER;
      else if (roll < 0.10) map[i] = T.GRASS;
      else if (roll < 0.12) map[i] = T.HIGH_GRASS;
    }
  }

  // Wall decorations (SPD Sewer sinks: walls adjacent to water)
  for (let y = 1; y < MAP_H - 1; y++) {
    for (let x = 1; x < MAP_W - 1; x++) {
      if (map[idx(x, y)] === T.WALL && map[idx(x, y + 1)] === T.WATER) {
        if (Math.random() < 0.25) map[idx(x, y)] = T.WALL_DECO;
      }
    }
  }

  // Entrance and exit
  const entrance = rooms[0];
  const exit = rooms[rooms.length - 1];
  map[idx(entrance.cx, entrance.cy)] = T.ENTRANCE;
  map[idx(exit.cx, exit.cy)] = T.EXIT;

  // Place player
  state.player.x = entrance.cx;
  state.player.y = entrance.cy;

  // Spawn mobs: SPD does ~3-5 per level, not in entrance room
  const mobCount = rng(3, 5);
  let spawned = 0;
  for (let ri = 1; ri < rooms.length && spawned < mobCount; ri++) {
    const r = rooms[ri];
    const inRoom = rng(1, 2);
    for (let m = 0; m < inRoom && spawned < mobCount; m++) {
      const mx = rng(r.x + 1, r.x + r.w - 2);
      const my = rng(r.y + 1, r.y + r.h - 2);
      if (PASSABLE.has(map[idx(mx, my)]) && !(mx === exit.cx && my === exit.cy)) {
        const type = spawnMobType(state.depth);
        state.mobs.push(createMob(type, mx, my));
        spawned++;
      }
    }
  }

  // Spawn tile drops in rooms (2-3 per level for playtesting, not in entrance room)
  state.floorItems = [];
  const tileDropCount = rng(2, 3);
  const validDropPositions = [];
  for (let ri = 1; ri < rooms.length; ri++) {
    const r = rooms[ri];
    for (let dx = r.x + 1; dx <= r.x + r.w - 2; dx++) {
      for (let dy = r.y + 1; dy <= r.y + r.h - 2; dy++) {
        if (PASSABLE.has(map[idx(dx, dy)]) && !(dx === exit.cx && dy === exit.cy)) {
          validDropPositions.push({ x: dx, y: dy });
        }
      }
    }
  }
  for (let i = validDropPositions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [validDropPositions[i], validDropPositions[j]] = [validDropPositions[j], validDropPositions[i]];
  }
  for (let i = 0; i < Math.min(tileDropCount, validDropPositions.length); i++) {
    const pos = validDropPositions[i];
    const tile = generateTile(state.depth);
    state.floorItems.push({ x: pos.x, y: pos.y, type: 'tile', tile });
  }

  state.rooms = rooms;
  computeAutotiles();
  updateFOV();
  centerCamera();
  updateUI();
  log(`You descend to depth ${state.depth}.`);
}

function carveCorridor(map, x1, y1, x2, y2) {
  let cx = x1, cy = y1;
  if (Math.random() < 0.5) {
    while (cx !== x2) { map[idx(cx, cy)] = T.EMPTY; cx += cx < x2 ? 1 : -1; }
    while (cy !== y2) { map[idx(cx, cy)] = T.EMPTY; cy += cy < y2 ? 1 : -1; }
  } else {
    while (cy !== y2) { map[idx(cx, cy)] = T.EMPTY; cy += cy < y2 ? 1 : -1; }
    while (cx !== x2) { map[idx(cx, cy)] = T.EMPTY; cx += cx < x2 ? 1 : -1; }
  }
  map[idx(x2, y2)] = T.EMPTY;
}

function placeDoors(map, room) {
  for (let x = room.x; x < room.x + room.w; x++) {
    for (const y of [room.y, room.y + room.h - 1]) {
      if (y > 0 && y < MAP_H - 1 && map[idx(x, y)] === T.EMPTY) {
        const above = map[idx(x, y - 1)];
        const below = map[idx(x, y + 1)];
        if ((above === T.WALL && below !== T.WALL) || (below === T.WALL && above !== T.WALL)) {
          if (map[idx(x, y === room.y ? y - 1 : y + 1)] === T.EMPTY) {
            map[idx(x, y)] = T.DOOR;
          }
        }
      }
    }
  }
  for (let y = room.y; y < room.y + room.h; y++) {
    for (const x of [room.x, room.x + room.w - 1]) {
      if (x > 0 && x < MAP_W - 1 && map[idx(x, y)] === T.EMPTY) {
        const left = map[idx(x - 1, y)];
        const right = map[idx(x + 1, y)];
        if ((left === T.WALL && right !== T.WALL) || (right === T.WALL && left !== T.WALL)) {
          if (map[idx(x === room.x ? x - 1 : x + 1, y)] === T.EMPTY) {
            map[idx(x, y)] = T.DOOR;
          }
        }
      }
    }
  }
}

// ============================================================
// FOV — Shadow Casting (from SPD's ShadowCaster.java)
// ============================================================

function updateFOV() {
  const { x: px, y: py } = state.player;
  const viewDist = 8;
  state.visible.fill(0);
  state.visible[idx(px, py)] = 1;
  state.explored[idx(px, py)] = 1;
  for (let octant = 0; octant < 8; octant++) {
    castLight(px, py, viewDist, 1, 1.0, 0.0, octant);
  }
}

function castLight(cx, cy, radius, row, startSlope, endSlope, octant) {
  if (startSlope < endSlope) return;
  let newStart = startSlope;
  for (let j = row; j <= radius; j++) {
    let blocked = false;
    for (let dx = -j; dx <= 0; dx++) {
      const dy = -j;
      let mx, my;
      switch (octant) {
        case 0: mx = cx + dx; my = cy + dy; break;
        case 1: mx = cx + dy; my = cy + dx; break;
        case 2: mx = cx - dy; my = cy + dx; break;
        case 3: mx = cx - dx; my = cy + dy; break;
        case 4: mx = cx - dx; my = cy - dy; break;
        case 5: mx = cx - dy; my = cy - dx; break;
        case 6: mx = cx + dy; my = cy - dx; break;
        case 7: mx = cx + dx; my = cy - dy; break;
      }
      if (mx < 0 || mx >= MAP_W || my < 0 || my >= MAP_H) continue;
      const leftSlope = (dx - 0.5) / (dy + 0.5);
      const rightSlope = (dx + 0.5) / (dy - 0.5);
      if (startSlope < rightSlope) continue;
      if (endSlope > leftSlope) break;
      if (dx * dx + dy * dy <= radius * radius) {
        state.visible[idx(mx, my)] = 1;
        state.explored[idx(mx, my)] = 1;
      }
      const isBlocking = BLOCKS_VISION.has(state.map[idx(mx, my)]);
      if (blocked) {
        if (isBlocking) { newStart = rightSlope; }
        else { blocked = false; startSlope = newStart; }
      } else if (isBlocking && j < radius) {
        blocked = true;
        castLight(cx, cy, radius, j + 1, startSlope, leftSlope, octant);
        newStart = rightSlope;
      }
    }
    if (blocked) break;
  }
}

// ============================================================
// PATHFINDING — A*
// ============================================================

function findPath(sx, sy, tx, ty, maxLen = 30) {
  if (sx === tx && sy === ty) return [];
  const open = [], closed = new Set(), gScore = new Map(), parent = new Map();
  const startKey = idx(sx, sy), endKey = idx(tx, ty);
  gScore.set(startKey, 0);
  open.push({ key: startKey, f: dist(sx, sy, tx, ty) });
  while (open.length > 0) {
    open.sort((a, b) => a.f - b.f);
    const current = open.shift();
    if (current.key === endKey) {
      const path = []; let k = endKey;
      while (k !== startKey) { path.unshift(toXY(k)); k = parent.get(k); }
      return path;
    }
    closed.add(current.key);
    const { x: cx, y: cy } = toXY(current.key);
    for (const [dx, dy] of [[0,-1],[1,0],[0,1],[-1,0]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || nx >= MAP_W || ny < 0 || ny >= MAP_H) continue;
      const nKey = idx(nx, ny);
      if (closed.has(nKey) || !PASSABLE.has(state.map[nKey])) continue;
      if (nKey !== endKey && state.mobs.some(m => m.x === nx && m.y === ny && m.hp > 0)) continue;
      const tentG = gScore.get(current.key) + 1;
      if (tentG > maxLen) continue;
      if (!gScore.has(nKey) || tentG < gScore.get(nKey)) {
        gScore.set(nKey, tentG);
        parent.set(nKey, current.key);
        open.push({ key: nKey, f: tentG + dist(nx, ny, tx, ty) });
      }
    }
  }
  return null;
}

// ============================================================
// PLAYER ACTIONS (with SPD combat math)
// ============================================================

function cancelAutoWalk() {
  if (state.autoWalkTimer) { clearTimeout(state.autoWalkTimer); state.autoWalkTimer = null; }
  state.autoWalkPath = null;
}

function movePlayer(tx, ty) {
  const { player, mobs } = state;
  cancelAutoWalk();

  const targetMob = mobs.find(m => m.x === tx && m.y === ty && m.hp > 0);
  if (targetMob && dist(player.x, player.y, tx, ty) === 1) {
    attackMob(targetMob);
    return;
  }

  const path = findPath(player.x, player.y, tx, ty);
  if (!path || path.length === 0) return;

  if (path.length === 1) { stepPlayer(path[0]); return; }
  state.autoWalkPath = path;
  autoWalkStep();
}

function autoWalkStep() {
  const { player, mobs } = state;
  const path = state.autoWalkPath;
  if (!path || path.length === 0) { cancelAutoWalk(); return; }

  const next = path[0];
  const hpBefore = player.hp;

  const blockingMob = mobs.find(m => m.x === next.x && m.y === next.y && m.hp > 0);
  if (blockingMob) { cancelAutoWalk(); attackMob(blockingMob); return; }

  stepPlayer(next);
  path.shift();

  if (player.hp < hpBefore || player.hp <= 0 || path.length === 0) { cancelAutoWalk(); return; }

  const nearbyMob = mobs.find(m => m.hp > 0 && state.visible[idx(m.x, m.y)] && dist(player.x, player.y, m.x, m.y) <= 2);
  if (nearbyMob) { cancelAutoWalk(); return; }

  state.autoWalkTimer = setTimeout(autoWalkStep, 120);
}

function stepPlayer(next) {
  const { player, map } = state;
  player.x = next.x;
  player.y = next.y;

  if (map[idx(player.x, player.y)] === T.DOOR) {
    map[idx(player.x, player.y)] = T.OPEN_DOOR;
    log('You open the door.');
  }

  // Pick up floor items (tile drops)
  const itemIdx = state.floorItems.findIndex(it => it.x === player.x && it.y === player.y);
  if (itemIdx !== -1) {
    const item = state.floorItems[itemIdx];
    if (item.type === 'tile') {
      if (state.heldTile) {
        log(`Swapped ${state.heldTile.name} for ${item.tile.name}.`);
      } else {
        log(`Picked up ${item.tile.name} tile!`);
      }
      const prevHeld = state.heldTile;
      state.heldTile = item.tile;
      state.floorItems.splice(itemIdx, 1);
      // Drop previously held tile on the ground
      if (prevHeld) {
        state.floorItems.push({ x: player.x, y: player.y, type: 'tile', tile: prevHeld });
      }
    }
  }

  if (map[idx(player.x, player.y)] === T.EXIT) {
    cancelAutoWalk();
    state.depth++;
    document.getElementById('depth-label').textContent = `Depth ${state.depth}`;
    generateLevel();
    return;
  }

  endTurn();
}

// ============================================================
// TILE ABILITY HOOKS
// These functions check placed tiles and apply ability effects
// ============================================================

// Check if player is "behind" a mob (approaching from opposite of mob's last move)
function isPlayerBehindMob(mob) {
  // Simple: player is behind if the mob hasn't moved toward the player
  // We approximate: if mob is adjacent and not facing player, count as behind
  // For now: 50% chance if mob wasn't the one to initiate melee this turn (not adjacent before)
  // More robust: track mob facing. For now, check if player moved to mob, not mob to player.
  return state.playerInitiatedAttack;
}

// Get all active abilities from placed tiles (checking powered state)
function getActiveAbilities() {
  const abilities = [];
  for (let i = 0; i < 9; i++) {
    const tile = state.tileBoard[i];
    if (!tile) continue;
    const connections = getConnections(i);
    const isPowered = connections.length > 0;
    abilities.push({
      id: tile.abilityId,
      tile,
      slot: i,
      isPowered,
      effect: isPowered ? tile.powered : tile.unpowered,
    });
  }
  return abilities;
}

// Apply on-hit effects (called when player successfully damages a mob)
function applyOnHitEffects(mob, baseDmg) {
  const abilities = getActiveAbilities();
  let totalBonusDmg = 0;
  let healAmount = 0;

  for (const ab of abilities) {
    switch (ab.id) {
      case 'backstab':
        if (isPlayerBehindMob(mob)) {
          if (ab.isPowered) {
            totalBonusDmg += baseDmg; // 2x total (base + bonus = 2x)
            log('Backstab! Double damage!');
          } else {
            totalBonusDmg += baseDmg; // 2x total
            log('Backstab! Double damage!');
          }
        }
        break;

      case 'arc': {
        // Chain to adjacent enemies
        const { player, mobs } = state;
        const adjMobs = mobs.filter(m =>
          m !== mob && m.hp > 0 &&
          dist(mob.x, mob.y, m.x, m.y) === 1
        );
        if (adjMobs.length > 0) {
          if (ab.isPowered) {
            // Chain to ALL adj, +20% per chain
            let chainBonus = 0;
            adjMobs.forEach((am, ci) => {
              const chainDmg = Math.max(1, Math.floor(baseDmg * (0.5 + 0.2 * ci)));
              am.hp -= chainDmg;
              chainBonus++;
              if (am.hp <= 0) {
                log(`Arc chains and kills the ${am.name}!`);
                gainXP(am.xp);
              } else {
                log(`Arc chains to ${am.name} for ${chainDmg}.`);
              }
            });
          } else {
            // Chain to 1 adj for 50%
            const target = adjMobs[0];
            const chainDmg = Math.max(1, Math.floor(baseDmg * 0.5));
            target.hp -= chainDmg;
            if (target.hp <= 0) {
              log(`Arc chains and kills the ${target.name}!`);
              gainXP(target.xp);
            } else {
              log(`Arc chains to ${target.name} for ${chainDmg}.`);
            }
          }
        }
        break;
      }

      case 'drain':
        if (ab.isPowered) {
          // Heal 15% + overheal as shield (not implemented shield yet, just heal more)
          healAmount += Math.max(1, Math.floor(baseDmg * 0.20));
          // One-hit kill bonus
          if (mob.hp - baseDmg <= 0) {
            healAmount += Math.floor(state.player.maxHp * 0.5);
            log('Drain: one-hit kill heals 50% max HP!');
          }
        } else {
          // Heal 15% of damage dealt
          healAmount += Math.max(1, Math.floor(baseDmg * 0.15));
        }
        break;
    }
  }

  // Apply healing
  if (healAmount > 0) {
    state.player.hp = Math.min(state.player.maxHp, state.player.hp + healAmount);
    log(`Drain heals you for ${healAmount}.`);
  }

  return totalBonusDmg;
}

// Apply when-hit effects (called when mob damages the player)
function applyWhenHitEffects(mob, dmgTaken) {
  const abilities = getActiveAbilities();
  state.hitsTakenThisTurn = (state.hitsTakenThisTurn || 0) + 1;

  for (const ab of abilities) {
    if (ab.id === 'thorns') {
      const reflected = Math.max(1, Math.floor(dmgTaken * 0.3));
      mob.hp -= reflected;
      log(`Thorns reflect ${reflected} damage!`);
      if (mob.hp <= 0) {
        log(`Thorns kill the ${mob.name}!`);
        gainXP(mob.xp);
      }
      // Powered: 3+ hits this turn = nova
      if (ab.isPowered && state.hitsTakenThisTurn >= 3) {
        const { mobs } = state;
        const adjMobs = mobs.filter(m =>
          m.hp > 0 && dist(state.player.x, state.player.y, m.x, m.y) === 1
        );
        for (const am of adjMobs) {
          const novaDmg = Math.max(1, Math.floor(dmgTaken * 0.5));
          am.hp -= novaDmg;
          log(`Thorns nova hits ${am.name} for ${novaDmg}!`);
          if (am.hp <= 0) {
            log(`Thorns nova kills the ${am.name}!`);
            gainXP(am.xp);
          }
        }
        state.hitsTakenThisTurn = 0; // Reset after nova
      }
    }
  }
}

// Apply stat bonuses from tiles to combat calculations
function getTileStatBonus(statName) {
  const bonuses = getTileBonuses();
  return bonuses[statName] || 0;
}

// SPD combat: hero attacks mob
state.playerInitiatedAttack = false;
function attackMob(mob) {
  const { player } = state;
  const weapon = player.weapon;
  state.playerInitiatedAttack = true;

  // Apply tile stat bonuses to combat
  const atkBonus = getTileStatBonus('atkSkill');
  const strBonus = getTileStatBonus('str');

  // Hit resolution (from SPD Char.java)
  const heroAccuracy = (player.atkSkill + atkBonus) * (weapon ? weapon.acc : 1);

  if (!resolveHit(heroAccuracy, mob.defSkill)) {
    log(`You miss the ${mob.name}.`);
    state.playerInitiatedAttack = false;
    endTurn();
    return;
  }

  // Damage roll
  let dmg = weapon ? weaponDamageRoll(weapon, player.str + strBonus) : normalIntRange(1, 4);

  // Mob DR
  const mobDR = normalIntRange(0, mob.dr);
  dmg = Math.max(0, dmg - mobDR);

  // Apply on-hit tile abilities (backstab, arc, drain, etc.)
  const bonusDmg = applyOnHitEffects(mob, dmg);
  dmg += bonusDmg;

  mob.hp -= dmg;

  if (dmg > 0) {
    log(`You hit the ${mob.name} for ${dmg}.`);
  } else {
    log(`You hit the ${mob.name} but deal no damage.`);
  }

  if (mob.hp <= 0) {
    log(`The ${mob.name} is defeated!`);
    gainXP(mob.xp);
  }

  state.playerInitiatedAttack = false;
  endTurn();
}

// SPD combat: mob attacks hero
function mobAttackHero(mob) {
  const { player } = state;
  const armor = player.armor;

  // Apply tile def bonus
  const defBonus = getTileStatBonus('defSkill');

  // Mob accuracy vs hero evasion
  if (!resolveHit(mob.atkSkill, player.defSkill + defBonus)) {
    log(`The ${mob.name} misses you.`);
    return;
  }

  let dmg = normalIntRange(mob.minDmg, mob.maxDmg);

  // Hero armor DR
  if (armor) {
    const dr = armorDR(armor);
    dmg = Math.max(0, dmg - dr);
  }

  player.hp -= dmg;

  if (dmg > 0) {
    log(`The ${mob.name} hits you for ${dmg}!`);
    // Apply when-hit tile abilities (thorns, etc.)
    applyWhenHitEffects(mob, dmg);
  } else {
    log(`The ${mob.name} hits you but your armor absorbs it.`);
  }
}

// XP and leveling (simplified from SPD)
function gainXP(amount) {
  const { player } = state;
  player.xp += amount;
  // SPD leveling thresholds roughly: level * (level - 1) / 2 * 5
  const xpToLevel = player.level * 5;
  if (player.xp >= xpToLevel) {
    player.xp -= xpToLevel;
    player.level++;
    player.atkSkill++;
    player.defSkill++;
    player.maxHp += 5;
    player.hp = Math.min(player.hp + 5, player.maxHp);
    log(`You reach level ${player.level}!`);
  }
}

function endTurn() {
  state.turn++;
  state.hitsTakenThisTurn = 0;
  mobTurns();
  updateFOV();
  centerCamera();
  updateUI();
  render();
}

function mobTurns() {
  const { player, mobs } = state;

  for (const mob of mobs) {
    if (mob.hp <= 0) continue;
    if (!state.visible[idx(mob.x, mob.y)]) continue;

    // Speed system: fast mobs (crab speed=2) act more often
    // Each mob accumulates action points; acts when >= 1.0
    mob.actTimer += mob.speed;
    while (mob.actTimer >= 1.0) {
      mob.actTimer -= 1.0;

      if (mob.hp <= 0) break;

      const d = dist(mob.x, mob.y, player.x, player.y);

      if (d === 1) {
        mobAttackHero(mob);
      } else if (d <= 6) {
        const path = findPath(mob.x, mob.y, player.x, player.y, 10);
        if (path && path.length > 0) {
          const next = path[0];
          if (!mobs.some(m => m !== mob && m.x === next.x && m.y === next.y && m.hp > 0)) {
            mob.x = next.x;
            mob.y = next.y;
          }
        }
      }
    }
  }

  // Player death
  if (player.hp <= 0) {
    log('You have been defeated...');
    setTimeout(() => {
      initPlayer();
      state.depth = 1;
      state.tileBoard = [null, null, null, null, null, null, null, null, null];
      state.heldTile = null;
      state.selectedBoardSlot = null;
      document.getElementById('depth-label').textContent = 'Depth 1';
      generateLevel();
      render();
    }, 1500);
  }
}

// ============================================================
// PLAYER INITIALIZATION (Warrior class from SPD)
// ============================================================

function initPlayer() {
  const p = state.player;
  p.hp = 20;
  p.maxHp = 20;
  p.str = 10;
  p.atkSkill = 10;
  p.defSkill = 5;
  p.xp = 0;
  p.level = 1;
  // Warrior starts with Worn Shortsword (tier 1) and Cloth Armor (tier 1)
  p.weapon = makeWeapon('Worn Shortsword', 1, 0);
  p.armor = makeArmor('Cloth Armor', 1, 0);
}

// ============================================================
// UI
// ============================================================

function updateUI() {
  const { player } = state;
  const pct = Math.max(0, player.hp / player.maxHp * 100);
  const fill = document.getElementById('hp-fill');
  fill.style.width = pct + '%';
  fill.style.background = pct > 50 ? '#4a2' : pct > 25 ? '#a82' : '#a22';

  // Equipment display
  const wName = player.weapon ? player.weapon.name : 'Fists';
  const aName = player.armor ? player.armor.name : 'None';
  const equipLabel = document.getElementById('equip-label');
  equipLabel.textContent = `STR:${player.str} Lv${player.level} | ${wName} | ${aName}`;

  // Held tile indicator
  const heldEl = document.getElementById('held-tile');
  if (state.heldTile) {
    heldEl.classList.add('has-tile');
    heldEl.querySelector('.held-icon').textContent = state.heldTile.icon;
    heldEl.querySelector('.held-name').textContent = state.heldTile.name;
  } else {
    heldEl.classList.remove('has-tile');
  }

  // Refresh panel if open
  if (panelOpen) updatePanelContents();
}

// CAMERA

function centerCamera() {
  const { player, scale } = state;
  const tileSize = TILE * scale;
  state.camera.x = player.x * tileSize - canvas.width / 2 + tileSize / 2;
  state.camera.y = player.y * tileSize - canvas.height / 2 + tileSize / 2;
}

let spritesLoaded = 0;

function loadSprites(callback) {
  for (const s of spriteQueue) {
    const img = new Image();
    img.onload = () => { sprites[s.name] = img; if (++spritesLoaded === spriteQueue.length) callback(); };
    img.onerror = () => { console.warn(`Failed: ${s.src}`); if (++spritesLoaded === spriteQueue.length) callback(); };
    img.src = s.src;
  }
}

// ============================================================
// KENNEY 1-BIT TILESET SYSTEM (ported from Pogue3)
// Tile extraction + bitmask wall autotiling
// Source tiles are 16x16 from monochrome-transparent_packed.png
// ============================================================

const KENNEY_TILE = 16; // source tile size in the spritesheet

// Extract a 16x16 tile from the Kenney sheet into an offscreen canvas
function extractTile(img, col, row) {
  const c = document.createElement('canvas');
  c.width = KENNEY_TILE;
  c.height = KENNEY_TILE;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, col * KENNEY_TILE, row * KENNEY_TILE, KENNEY_TILE, KENNEY_TILE, 0, 0, KENNEY_TILE, KENNEY_TILE);
  return c;
}

// Rotate a tile canvas clockwise by degrees (90, 180, 270)
function rotateTile(srcCanvas, degrees) {
  const c = document.createElement('canvas');
  c.width = KENNEY_TILE;
  c.height = KENNEY_TILE;
  const ctx = c.getContext('2d');
  ctx.translate(KENNEY_TILE / 2, KENNEY_TILE / 2);
  ctx.rotate(degrees * Math.PI / 180);
  ctx.drawImage(srcCanvas, -KENNEY_TILE / 2, -KENNEY_TILE / 2);
  return c;
}

// Composite overlay onto base (non-transparent pixels overlay)
function compositeTiles(base, overlay) {
  const c = document.createElement('canvas');
  c.width = KENNEY_TILE;
  c.height = KENNEY_TILE;
  const ctx = c.getContext('2d');
  ctx.drawImage(base, 0, 0);
  ctx.drawImage(overlay, 0, 0);
  return c;
}

// All tile canvases, keyed by autotile ID
const tiles = {};

// Autotile bitmask lookup: N=8, E=4, S=2, W=1 (floor neighbors of a wall)
const AUTOTILE_MAP = {};

function buildTileAtlas() {
  const img = sprites.kenney;
  if (!img) return;

  // --- Floor tile from (0,0) ---
  tiles.FLOOR = extractTile(img, 0, 0);

  // --- (7,3) Single wall edge on W side ---
  const wallW = extractTile(img, 7, 3);
  const wallN = rotateTile(wallW, 90);
  const wallE = rotateTile(wallW, 180);
  const wallS = rotateTile(wallW, 270);
  tiles.WALL_W = wallW;
  tiles.WALL_N = wallN;
  tiles.WALL_E = wallE;
  tiles.WALL_S = wallS;

  // --- (8,3) L-corner walls on NW ---
  const cornerNW = extractTile(img, 8, 3);
  const cornerNE = rotateTile(cornerNW, 90);
  const cornerSE = rotateTile(cornerNW, 180);
  const cornerSW = rotateTile(cornerNW, 270);
  tiles.CORNER_NW = cornerNW;
  tiles.CORNER_NE = cornerNE;
  tiles.CORNER_SE = cornerSE;
  tiles.CORNER_SW = cornerSW;

  // --- (9,3) Small corner fill on SW ---
  const fillSW = extractTile(img, 9, 3);
  const fillNW = rotateTile(fillSW, 90);
  const fillNE = rotateTile(fillSW, 180);
  const fillSE = rotateTile(fillSW, 270);
  tiles.FILL_SW = fillSW;
  tiles.FILL_NW = fillNW;
  tiles.FILL_NE = fillNE;
  tiles.FILL_SE = fillSE;

  // --- (10,3) Double wall on E+W ---
  const wallEW = extractTile(img, 10, 3);
  const wallNS = rotateTile(wallEW, 90);
  tiles.WALL_EW = wallEW;
  tiles.WALL_NS = wallNS;

  // --- (11,3) Three walls, open to N ---
  const threeN = extractTile(img, 11, 3);
  const threeE = rotateTile(threeN, 90);
  const threeS = rotateTile(threeN, 180);
  const threeW = rotateTile(threeN, 270);
  tiles.THREE_N = threeN;
  tiles.THREE_E = threeE;
  tiles.THREE_S = threeS;
  tiles.THREE_W = threeW;

  // --- Pillar: composite E+W and N+S ---
  tiles.PILLAR = compositeTiles(wallEW, wallNS);

  // --- Solid wall: all four single walls composited ---
  let solid = compositeTiles(wallN, wallE);
  solid = compositeTiles(solid, wallS);
  solid = compositeTiles(solid, wallW);
  tiles.WALL_SOLID = solid;

  // Build autotile lookup: bitmask -> tile canvas
  // Bitmask: N=8, E=4, S=2, W=1 (which directions have FLOOR neighbors)
  AUTOTILE_MAP[0b0000] = tiles.WALL_SOLID;
  AUTOTILE_MAP[0b0001] = tiles.WALL_W;
  AUTOTILE_MAP[0b0010] = tiles.WALL_S;
  AUTOTILE_MAP[0b0011] = tiles.CORNER_SW;
  AUTOTILE_MAP[0b0100] = tiles.WALL_E;
  AUTOTILE_MAP[0b0101] = tiles.WALL_EW;
  AUTOTILE_MAP[0b0110] = tiles.CORNER_SE;
  AUTOTILE_MAP[0b0111] = tiles.THREE_S;
  AUTOTILE_MAP[0b1000] = tiles.WALL_N;
  AUTOTILE_MAP[0b1001] = tiles.CORNER_NW;
  AUTOTILE_MAP[0b1010] = tiles.WALL_NS;
  AUTOTILE_MAP[0b1011] = tiles.THREE_W;
  AUTOTILE_MAP[0b1100] = tiles.CORNER_NE;
  AUTOTILE_MAP[0b1101] = tiles.THREE_N;
  AUTOTILE_MAP[0b1110] = tiles.THREE_E;
  AUTOTILE_MAP[0b1111] = tiles.PILLAR;
}

// Autotile array: stores the tile canvas key for each map cell
// Computed after dungeon generation
const autoTileMap = new Array(MAP_W * MAP_H);

function computeAutotiles() {
  const map = state.map;

  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const i = idx(x, y);

      // Floor tiles (all passable terrain)
      if (PASSABLE.has(map[i])) {
        autoTileMap[i] = tiles.FLOOR;
        continue;
      }

      // Wall tiles: check cardinal floor neighbors
      const nFloor = y > 0 && PASSABLE.has(map[idx(x, y - 1)]);
      const sFloor = y < MAP_H - 1 && PASSABLE.has(map[idx(x, y + 1)]);
      const eFloor = x < MAP_W - 1 && PASSABLE.has(map[idx(x + 1, y)]);
      const wFloor = x > 0 && PASSABLE.has(map[idx(x - 1, y)]);

      let mask = 0;
      if (nFloor) mask |= 8;
      if (eFloor) mask |= 4;
      if (sFloor) mask |= 2;
      if (wFloor) mask |= 1;

      // Special case: no cardinal floors but diagonal floor exists -> corner fill
      if (mask === 0) {
        const nwFloor = x > 0 && y > 0 && PASSABLE.has(map[idx(x - 1, y - 1)]);
        const swFloor = x > 0 && y < MAP_H - 1 && PASSABLE.has(map[idx(x - 1, y + 1)]);
        const seFloor = x < MAP_W - 1 && y < MAP_H - 1 && PASSABLE.has(map[idx(x + 1, y + 1)]);
        const neFloor = x < MAP_W - 1 && y > 0 && PASSABLE.has(map[idx(x + 1, y - 1)]);

        if (nwFloor) { autoTileMap[i] = tiles.FILL_NW; continue; }
        if (swFloor) { autoTileMap[i] = tiles.FILL_SW; continue; }
        if (seFloor) { autoTileMap[i] = tiles.FILL_SE; continue; }
        if (neFloor) { autoTileMap[i] = tiles.FILL_NE; continue; }
      }

      autoTileMap[i] = AUTOTILE_MAP[mask] || tiles.WALL_SOLID;
    }
  }
}

// ============================================================
// RENDERING
// ============================================================

// Tile color config (Pogue3 palette: cool dark blue tones)
const FLOOR_FG = [200, 200, 200];
const FLOOR_BG = [20, 20, 30];
const WALL_FG = [100, 100, 110];
const WALL_BG = [30, 30, 40];
const FLOOR_FG_DIM = [60, 60, 70];
const FLOOR_BG_DIM = [10, 10, 15];
const WALL_FG_DIM = [40, 40, 50];
const WALL_BG_DIM = [15, 15, 20];

// Pre-tinted tile cache: tileCanvas -> { 'fg_bg': canvas }
// Eliminates per-frame offscreen canvas compositing (was the #1 perf bottleneck)
const _preTintedCache = new Map();

function preTintKey(fg, bg) {
  return `${fg[0]},${fg[1]},${fg[2]}_${bg[0]},${bg[1]},${bg[2]}`;
}

// Pre-tint a tile canvas with given fg/bg colors, returning a ready-to-draw canvas
function preTintTile(tileCanvas, fg, bg) {
  if (!tileCanvas) return null;
  // Check cache
  let tileMap = _preTintedCache.get(tileCanvas);
  if (!tileMap) {
    tileMap = {};
    _preTintedCache.set(tileCanvas, tileMap);
  }
  const key = preTintKey(fg, bg);
  if (tileMap[key]) return tileMap[key];

  // Create pre-tinted version
  const c = document.createElement('canvas');
  c.width = KENNEY_TILE;
  c.height = KENNEY_TILE;
  const tctx = c.getContext('2d');
  // Fill bg
  tctx.fillStyle = `rgb(${bg[0]},${bg[1]},${bg[2]})`;
  tctx.fillRect(0, 0, KENNEY_TILE, KENNEY_TILE);
  // Draw tile then tint with source-atop
  tctx.drawImage(tileCanvas, 0, 0);
  tctx.globalCompositeOperation = 'source-atop';
  tctx.fillStyle = `rgb(${fg[0]},${fg[1]},${fg[2]})`;
  tctx.fillRect(0, 0, KENNEY_TILE, KENNEY_TILE);
  tctx.globalCompositeOperation = 'source-over';

  tileMap[key] = c;
  return c;
}

// Build all pre-tinted variants after atlas is ready
function buildPreTintedCache() {
  // Pre-tint all tile types in all 4 color variants (visible floor/wall, explored floor/wall)
  const colorSets = [
    [FLOOR_FG, FLOOR_BG], [WALL_FG, WALL_BG],
    [FLOOR_FG_DIM, FLOOR_BG_DIM], [WALL_FG_DIM, WALL_BG_DIM],
  ];
  const allTiles = Object.values(tiles);
  // Also pre-tint all autotile map entries
  for (const t of Object.values(AUTOTILE_MAP)) {
    if (!allTiles.includes(t)) allTiles.push(t);
  }
  for (const t of allTiles) {
    if (!t) continue;
    for (const [fg, bg] of colorSets) {
      preTintTile(t, fg, bg);
    }
  }
}

// Fast tile draw using pre-tinted cache (single drawImage per tile)
function drawTile(tileCanvas, screenX, screenY, tileSize, fg, bg) {
  const tinted = tileCanvas ? preTintTile(tileCanvas, fg, bg) : null;
  if (tinted) {
    ctx.drawImage(tinted, 0, 0, KENNEY_TILE, KENNEY_TILE, screenX, screenY, tileSize, tileSize);
  } else {
    ctx.fillStyle = `rgb(${bg[0]},${bg[1]},${bg[2]})`;
    ctx.fillRect(screenX, screenY, tileSize, tileSize);
  }
}

function render() {
  const { map, visible, explored, player, mobs, camera, scale } = state;
  const tileSize = TILE * scale;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = false;

  const startX = Math.floor(camera.x / tileSize) - 1;
  const startY = Math.floor(camera.y / tileSize) - 1;
  const endX = startX + Math.ceil(canvas.width / tileSize) + 2;
  const endY = startY + Math.ceil(canvas.height / tileSize) + 2;

  const useTileset = !!tiles.FLOOR;

  // Tiles
  for (let y = startY; y <= endY; y++) {
    for (let x = startX; x <= endX; x++) {
      if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) continue;
      const i = idx(x, y);
      const screenX = Math.floor(x * tileSize - camera.x);
      const screenY = Math.floor(y * tileSize - camera.y);
      const isFloor = PASSABLE.has(map[i]);

      if (visible[i]) {
        if (useTileset) {
          const fg = isFloor ? FLOOR_FG : WALL_FG;
          const bg = isFloor ? FLOOR_BG : WALL_BG;
          drawTile(autoTileMap[i], screenX, screenY, tileSize, fg, bg);
        } else {
          ctx.fillStyle = TILE_COLORS[map[i]] || '#000';
          ctx.fillRect(screenX, screenY, tileSize, tileSize);
        }
        // Special overlays for entrance/exit/doors
        if (map[i] === T.ENTRANCE) {
          ctx.fillStyle = 'rgba(40,120,40,0.5)';
          ctx.fillRect(screenX + tileSize*0.25, screenY + tileSize*0.25, tileSize*0.5, tileSize*0.5);
        } else if (map[i] === T.EXIT) {
          ctx.fillStyle = 'rgba(120,40,40,0.5)';
          ctx.fillRect(screenX + tileSize*0.25, screenY + tileSize*0.25, tileSize*0.5, tileSize*0.5);
        } else if (map[i] === T.DOOR) {
          ctx.fillStyle = 'rgba(184,134,11,0.6)';
          ctx.fillRect(screenX + 2, screenY + 2, tileSize - 4, tileSize - 4);
        }
      } else if (explored[i]) {
        if (useTileset) {
          const fg = isFloor ? FLOOR_FG_DIM : WALL_FG_DIM;
          const bg = isFloor ? FLOOR_BG_DIM : WALL_BG_DIM;
          drawTile(autoTileMap[i], screenX, screenY, tileSize, fg, bg);
        } else {
          ctx.fillStyle = TILE_COLORS[map[i]] || '#000';
          ctx.globalAlpha = 0.35;
          ctx.fillRect(screenX, screenY, tileSize, tileSize);
          ctx.globalAlpha = 1.0;
        }
      }
    }
  }

  // Floor items (tile drops)
  for (const item of state.floorItems) {
    if (!visible[idx(item.x, item.y)]) continue;
    const screenX = Math.floor(item.x * tileSize - camera.x);
    const screenY = Math.floor(item.y * tileSize - camera.y);
    // Static glow background (no animation needed)
    ctx.fillStyle = 'rgba(100,180,255,0.2)';
    ctx.fillRect(screenX + 2, screenY + 2, tileSize - 4, tileSize - 4);
    // Tile icon
    ctx.fillStyle = '#8cf';
    ctx.font = `bold ${Math.floor(tileSize * 0.55)}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.tile.icon, screenX + tileSize / 2, screenY + tileSize / 2);
  }

  // Mobs
  for (const mob of mobs) {
    if (mob.hp <= 0 || !visible[idx(mob.x, mob.y)]) continue;
    const screenX = Math.floor(mob.x * tileSize - camera.x);
    const screenY = Math.floor(mob.y * tileSize - camera.y);
    const spriteImg = sprites[mob.name];
    const def = MOB_SPRITES[mob.name];

    if (spriteImg && def) {
      ctx.drawImage(spriteImg,
        def.col * def.w, def.row * def.h, def.w, def.h,
        screenX + (tileSize - def.w * scale) / 2,
        screenY + (tileSize - def.h * scale) / 2,
        def.w * scale, def.h * scale
      );
    } else {
      ctx.fillStyle = '#c44';
      ctx.beginPath();
      ctx.arc(screenX + tileSize/2, screenY + tileSize/2, tileSize*0.35, 0, Math.PI*2);
      ctx.fill();
    }

    // Mob HP bar
    if (mob.hp < mob.maxHp) {
      const barW = tileSize * 0.8, barH = 3;
      const barX = screenX + (tileSize - barW) / 2;
      const barY = screenY - barH - 2;
      ctx.fillStyle = '#600';
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = '#c44';
      ctx.fillRect(barX, barY, barW * (mob.hp / mob.maxHp), barH);
    }
  }

  // Player
  {
    const screenX = Math.floor(player.x * tileSize - camera.x);
    const screenY = Math.floor(player.y * tileSize - camera.y);
    const spriteImg = sprites.warrior;
    const def = MOB_SPRITES.warrior;
    if (spriteImg && def) {
      ctx.drawImage(spriteImg,
        def.col * def.w, def.row * def.h, def.w, def.h,
        screenX + (tileSize - def.w * scale) / 2,
        screenY + (tileSize - def.h * scale) / 2,
        def.w * scale, def.h * scale
      );
    } else {
      ctx.fillStyle = '#4af';
      ctx.beginPath();
      ctx.arc(screenX + tileSize/2, screenY + tileSize/2, tileSize*0.4, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

  { a: 'blink', b: 'arc', name: 'Thunder Step', desc: 'Teleport fires chain lightning at origin' },
  { a: 'backstab', b: 'ghost', name: 'Ghost Blade', desc: 'Backstab kills spawn ghosts that backstab enemies' },
  { a: 'shockwave', b: 'chill', name: 'Shatter Strike', desc: 'Push frozen enemy = 3x dmg + ice shards AoE' },
  { a: 'thorns', b: 'venom', name: 'Poison Thorns', desc: 'Reflected thorn damage applies venom stacks' },
  { a: 'frenzy', b: 'fortify', name: 'Juggernaut', desc: 'Frenzied: charge through enemies damaging all in path' },
  { a: 'gravity', b: 'detonate', name: 'Implosion', desc: 'Gravity well detonates all Marks on pulled enemies' },
  { a: 'smoke', b: 'drain', name: 'Phantom Drain', desc: 'Invisible attacks drain 2x HP, stay invisible 1 extra hit' },
  { a: 'puppet', b: 'chill', name: 'Mass Hysteria', desc: 'Confused enemies also terrified, attack each other + flee' },
  { a: 'barricade', b: 'ricochet', name: 'Killbox', desc: 'Your walls become ricochet surfaces for attacks' },
  { a: 'curse_eater', b: 'mimic', name: 'Dark Apotheosis', desc: 'Steal ability + debuffs, each debuff +30% stolen ability' },
  { a: 'ghost', b: 'detonate', name: 'Spectral Bomb', desc: 'Ghosts carry Marks, detonate on expire' },
  { a: 'blink', b: 'chill', name: 'Frost Flash', desc: 'Teleport leaves frost zones at origin and destination' },
  { a: 'venom', b: 'arc', name: 'Plague Lightning', desc: 'Chain lightning spreads venom stacks to all targets' },
  { a: 'drain', b: 'frenzy', name: 'Blood Frenzy', desc: 'Lifesteal scales with frenzy damage bonus' },
];

// ============================================================
// TILE GENERATION SYSTEM
// Scoring function determines rarity. Higher score = rarer drop.
// ============================================================

// All abilities combined for random selection
const ALL_ABILITIES = [...TILE_ABILITIES, ...STAT_ABILITIES];

// Generate a tile instance with random connectors
function generateTile(depthBonus = 0) {
  // Pick ability: 75% chance combat ability, 25% stat/utility
  const pool = Math.random() < 0.75 ? TILE_ABILITIES : STAT_ABILITIES;
  const ability = pool[Math.floor(Math.random() * pool.length)];

  // Generate connectors: 0-4 sides (top=0, right=1, bottom=2, left=3)
  // More connectors are rarer via weighted roll
  const connectorCount = rollConnectorCount();
  const connectors = [false, false, false, false]; // [top, right, bottom, left]
  const sides = [0, 1, 2, 3];
  // Shuffle and pick
  for (let i = sides.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [sides[i], sides[j]] = [sides[j], sides[i]];
  }
  for (let i = 0; i < connectorCount; i++) {
    connectors[sides[i]] = true;
  }

  const tile = {
    abilityId: ability.id,
    name: ability.name,
    archetype: ability.archetype || null,
    type: ability.type,
    icon: ability.icon,
    connectors,
    cooldown: ability.cooldown || 0,
    cooldownTimer: 0,
    unpowered: ability.unpowered,
    powered: ability.powered,
    strength: ability.strength,
  };

  tile.score = scoreTile(tile);
  return tile;
}

// Weighted connector count: 0=10%, 1=35%, 2=30%, 3=18%, 4=7%
function rollConnectorCount() {
  const r = Math.random();
  if (r < 0.10) return 0;
  if (r < 0.45) return 1;
  if (r < 0.75) return 2;
  if (r < 0.93) return 3;
  return 4;
}

// Score a tile for rarity: higher = rarer
function scoreTile(tile) {
  let score = tile.strength || 5;
  // Connector bonus: each connector adds value
  const connCount = tile.connectors.filter(c => c).length;
  score += connCount * 1.5;
  return score;
}

// Should this tile drop? Based on score vs depth
// Higher score tiles only start appearing at deeper depths
function shouldDropTile(depth) {
  // Base chance: 40% per floor, increasing slightly with depth
  const chance = 0.40 + depth * 0.02;
  return Math.random() < chance;
}

// ============================================================
// TILE BOARD STATE & LOGIC
// ============================================================

// 3x3 board — each slot is null or a tile object
state.tileBoard = [null, null, null, null, null, null, null, null, null];
state.heldTile = null; // tile picked up but not yet placed

// Check if two board slots are adjacent
function areBoardAdjacent(slotA, slotB) {
  const rowA = Math.floor(slotA / 3), colA = slotA % 3;
  const rowB = Math.floor(slotB / 3), colB = slotB % 3;
  return (Math.abs(rowA - rowB) + Math.abs(colA - colB)) === 1;
}

// Get the shared edge direction from slotA to slotB
// Returns: 0=top, 1=right, 2=bottom, 3=left, or -1 if not adjacent
function sharedEdge(slotA, slotB) {
  const rowA = Math.floor(slotA / 3), colA = slotA % 3;
  const rowB = Math.floor(slotB / 3), colB = slotB % 3;
  if (rowB === rowA - 1 && colB === colA) return 0; // B is above A → top
  if (rowB === rowA + 1 && colB === colA) return 2; // B is below A → bottom
  if (colB === colA + 1 && rowB === rowA) return 1; // B is right of A → right
  if (colB === colA - 1 && rowB === rowA) return 3; // B is left of A → left
  return -1;
}

// Opposite edge: top↔bottom, right↔left
function oppositeEdge(edge) {
  return [2, 3, 0, 1][edge];
}

// Check if two tiles in given slots are connected via connectors
function areTilesConnected(slotA, slotB) {
  const tileA = state.tileBoard[slotA];
  const tileB = state.tileBoard[slotB];
  if (!tileA || !tileB) return false;
  const edge = sharedEdge(slotA, slotB);
  if (edge === -1) return false;
  return tileA.connectors[edge] && tileB.connectors[oppositeEdge(edge)];
}

// Get all connections for a tile in a given slot
function getConnections(slot) {
  const connections = [];
  const row = Math.floor(slot / 3), col = slot % 3;
  const neighbors = [];
  if (row > 0) neighbors.push(slot - 3); // top
  if (col < 2) neighbors.push(slot + 1); // right
  if (row < 2) neighbors.push(slot + 3); // bottom
  if (col > 0) neighbors.push(slot - 1); // left
  for (const n of neighbors) {
    if (areTilesConnected(slot, n)) connections.push(n);
  }
  return connections;
}

// Check for active duo combos on the board
function getActiveDuoCombos() {
  const combos = [];
  for (const duo of DUO_COMBOS) {
    // Find all slots containing each tile of the duo
    for (let i = 0; i < 9; i++) {
      if (!state.tileBoard[i] || state.tileBoard[i].abilityId !== duo.a) continue;
      for (let j = 0; j < 9; j++) {
        if (i === j) continue;
        if (!state.tileBoard[j] || state.tileBoard[j].abilityId !== duo.b) continue;
        if (areTilesConnected(i, j)) {
          combos.push({ ...duo, slotA: i, slotB: j });
        }
      }
    }
  }
  return combos;
}

// Calculate total stat bonuses from all placed tiles
function getTileBonuses() {
  const bonuses = { str: 0, atkSkill: 0, defSkill: 0, cdReduction: 0 };
  for (let i = 0; i < 9; i++) {
    const tile = state.tileBoard[i];
    if (!tile) continue;
    const isPowered = getConnections(i).length > 0;
    const effect = isPowered ? tile.powered : tile.unpowered;
    if (tile.type === 'stat' && effect.stat) {
      bonuses[effect.stat] += effect.value;
    }
    if (tile.type === 'utility' && effect.cdReduction) {
      bonuses.cdReduction = Math.min(0.75, bonuses.cdReduction + effect.cdReduction);
    }
  }
  return bonuses;
}

// Items on the dungeon floor (tile drops)
state.floorItems = [];

// ============================================================
// PANEL UI
// ============================================================

const panelOverlay = document.getElementById('panel-overlay');
const panelTabs = document.querySelectorAll('.panel-tab');
const tabContents = document.querySelectorAll('.tab-content');
const tileBoardBtn = document.getElementById('tile-board-btn');
const panelClose = document.getElementById('panel-close');

let panelOpen = false;

function openPanel() {
  panelOpen = true;
  panelOverlay.classList.add('open');
  updatePanelContents();
}

function closePanel() {
  panelOpen = false;
  panelOverlay.classList.remove('open');
}

function switchTab(tabName) {
  panelTabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tabName));
  tabContents.forEach(tc => tc.classList.toggle('active', tc.id === `tab-${tabName}`));
}

// Tab switching
panelTabs.forEach(tab => {
  tab.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    switchTab(tab.dataset.tab);
  });
});

// Open/close
tileBoardBtn.addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  e.preventDefault();
  if (panelOpen) closePanel(); else openPanel();
});

// Tapping held tile indicator opens board tab directly
document.getElementById('held-tile').addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  e.preventDefault();
  openPanel();
  switchTab('board');
});

panelClose.addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  closePanel();
});

// Close on overlay background tap
panelOverlay.addEventListener('pointerdown', (e) => {
  if (e.target === panelOverlay) closePanel();
});

// Board cell interaction: place tiles or inspect
state.selectedBoardSlot = null;
document.querySelector('.tile-board-grid').addEventListener('pointerdown', (e) => {
  const cell = e.target.closest('.board-cell');
  if (!cell) return;
  e.stopPropagation();
  const slot = parseInt(cell.dataset.slot);
  if (isNaN(slot)) return;

  if (!state.tileBoard[slot] && state.heldTile) {
    // Place held tile into empty slot
    state.tileBoard[slot] = state.heldTile;
    state.heldTile = null;
    state.selectedBoardSlot = slot;
    log(`Placed ${state.tileBoard[slot].name} in slot ${slot + 1}.`);
    updateUI();
  } else if (state.tileBoard[slot]) {
    // Tap filled slot to inspect
    state.selectedBoardSlot = (state.selectedBoardSlot === slot) ? null : slot;
    updatePanelContents();
  }
});

function updatePanelContents() {
  const { player } = state;

  // Equipment tab
  const wSlot = document.querySelector('#equip-weapon');
  const aSlot = document.querySelector('#equip-armor');

  if (player.weapon) {
    wSlot.querySelector('.slot-name').textContent = player.weapon.name;
    wSlot.querySelector('.slot-stats').textContent =
      `${player.weapon.minDmg}-${player.weapon.maxDmg} dmg  STR:${player.weapon.strReq}`;
  } else {
    wSlot.querySelector('.slot-name').textContent = 'Fists';
    wSlot.querySelector('.slot-stats').textContent = '1-4 dmg';
  }

  if (player.armor) {
    aSlot.querySelector('.slot-name').textContent = player.armor.name;
    aSlot.querySelector('.slot-stats').textContent =
      `${player.armor.drMin}-${player.armor.drMax} DR  STR:${player.armor.strReq}`;
  } else {
    aSlot.querySelector('.slot-name').textContent = 'None';
    aSlot.querySelector('.slot-stats').textContent = '';
  }

  // Stats
  document.getElementById('stat-hp').textContent = `${player.hp}/${player.maxHp}`;
  document.getElementById('stat-str').textContent = player.str;
  document.getElementById('stat-atk').textContent = player.atkSkill;
  document.getElementById('stat-def').textContent = player.defSkill;
  document.getElementById('stat-lvl').textContent = player.level;
  document.getElementById('stat-xp').textContent = `${player.xp}/${player.level * 5}`;

  // Tile board tab
  const cells = document.querySelectorAll('.board-cell');
  const board = state.tileBoard;
  let filledCount = 0;
  const edgeNames = ['top', 'right', 'bottom', 'left'];

  cells.forEach((cell, i) => {
    const tile = board[i];
    cell.classList.remove('filled', 'powered', 'placeable');

    if (tile) {
      filledCount++;
      const connections = getConnections(i);
      const isPowered = connections.length > 0;

      cell.classList.add('filled');
      if (isPowered) cell.classList.add('powered');

      // Build cell HTML with connectors
      let html = `<span class="cell-label">${i + 1}</span>`;
      html += tile.icon || '?';
      html += `<span class="cell-name">${tile.name}</span>`;

      // Show connector dots
      for (let e = 0; e < 4; e++) {
        if (tile.connectors[e]) {
          // Check if this connector is actually connected to a neighbor
          const neighborSlots = { 0: i - 3, 1: i + 1, 2: i + 3, 3: i - 1 };
          const nSlot = neighborSlots[e];
          const nTile = (nSlot >= 0 && nSlot < 9) ? board[nSlot] : null;
          // Check bounds: right edge can't connect right, etc.
          const col = i % 3, row = Math.floor(i / 3);
          let valid = true;
          if (e === 0 && row === 0) valid = false;
          if (e === 1 && col === 2) valid = false;
          if (e === 2 && row === 2) valid = false;
          if (e === 3 && col === 0) valid = false;

          const isConn = valid && nTile && nTile.connectors[oppositeEdge(e)];
          html += `<span class="connector ${edgeNames[e]} active${isConn ? ' connected' : ''}"></span>`;
        }
      }
      cell.innerHTML = html;
    } else {
      // Empty slot — show as placeable if player has a held tile
      if (state.heldTile) {
        cell.classList.add('placeable');
        cell.innerHTML = `<span class="cell-label">${i + 1}</span>+`;
      } else {
        cell.innerHTML = `<span class="cell-label">${i + 1}</span>\u00B7`;
      }
    }
  });

  // Status text
  const statusEl = document.querySelector('.board-status');
  if (filledCount === 0 && !state.heldTile) {
    statusEl.textContent = 'No tiles placed yet. Find tiles in the dungeon.';
  } else if (filledCount === 9) {
    statusEl.textContent = 'Board complete!';
  } else if (state.heldTile) {
    statusEl.textContent = `${filledCount}/9 placed. Tap an empty slot to place tile.`;
  } else {
    statusEl.textContent = `${filledCount}/9 tiles placed.`;
  }

  // Held tile preview
  let detailEl = document.querySelector('#tab-board .held-preview');
  if (state.heldTile) {
    if (!detailEl) {
      detailEl = document.createElement('div');
      detailEl.className = 'held-preview';
      document.getElementById('tab-board').appendChild(detailEl);
    }
    const t = state.heldTile;
    const connNames = edgeNames.filter((_, e) => t.connectors[e]);
    detailEl.innerHTML = `
      <div class="hp-label">${t.icon} ${t.name} <span style="color:#668;font-weight:normal;font-size:10px">${t.archetype || t.type}</span></div>
      <div class="hp-ability">${t.unpowered.desc}</div>
      <div style="color:#4af;font-size:10px">Powered: ${t.powered.desc}</div>
      <div class="hp-connectors">Connectors: ${connNames.length ? connNames.join(', ') : 'none'}</div>
    `;
  } else if (detailEl) {
    detailEl.remove();
  }

  // Selected tile detail (if tapping a filled cell)
  let selDetail = document.querySelector('#tab-board .tile-detail');
  if (state.selectedBoardSlot !== undefined && state.selectedBoardSlot !== null) {
    const st = board[state.selectedBoardSlot];
    if (st) {
      if (!selDetail) {
        selDetail = document.createElement('div');
        selDetail.className = 'tile-detail';
        document.getElementById('tab-board').appendChild(selDetail);
      }
      const connections = getConnections(state.selectedBoardSlot);
      const isPowered = connections.length > 0;
      let html = `<div class="td-name">${st.icon} ${st.name}</div>`;
      html += `<div class="td-type">${st.archetype || st.type}${st.cooldown ? ` \u2022 CD: ${st.cooldown}t` : ''}</div>`;
      html += `<div class="td-ability">${st.unpowered.desc}</div>`;
      if (isPowered) {
        html += `<div class="td-powered">\u26A1 ${st.powered.desc}</div>`;
      } else {
        html += `<div style="color:#555;font-size:10px">Connect to power up: ${st.powered.desc}</div>`;
      }
      // Check for duo combos involving this tile
      const duos = getActiveDuoCombos().filter(d => d.slotA === state.selectedBoardSlot || d.slotB === state.selectedBoardSlot);
      for (const d of duos) {
        html += `<div class="td-duo">\u2728 ${d.name}: ${d.desc}</div>`;
      }
      selDetail.innerHTML = html;
    } else if (selDetail) {
      selDetail.remove();
    }
  } else if (selDetail) {
    selDetail.remove();
  }

  // Show active duo combos in status
  const duos = getActiveDuoCombos();
  if (duos.length > 0) {
    const duoEl = document.querySelector('.board-status');
    duoEl.textContent += ` ${duos.length} duo combo${duos.length > 1 ? 's' : ''} active!`;
  }
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (panelOpen) return; // Don't process game input while panel is open
  const { camera, scale } = state;
  const tileSize = TILE * scale;
  const tx = Math.floor((e.clientX + camera.x) / tileSize);
  const ty = Math.floor((e.clientY + camera.y) / tileSize);
  if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return;
  if (!state.visible[idx(tx, ty)]) return;
  movePlayer(tx, ty);
});

}

initPlayer();
loadSprites(() => {
