<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Roguelike</title>
<link rel="manifest" href="manifest.json">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: manipulation;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
#ui-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}
#hp-bar {
  position: fixed;
  top: env(safe-area-inset-top, 8px);
  left: 8px; right: 8px;
  height: 6px;
  background: #333;
  border-radius: 3px;
  z-index: 20;
  pointer-events: none;
}
#hp-fill {
  height: 100%;
  background: #4a2;
  border-radius: 3px;
  transition: width 0.3s;
}
#depth-label {
  position: fixed;
  top: calc(env(safe-area-inset-top, 8px) + 10px);
  left: 12px;
  color: #ccc;
  font: bold 11px monospace;
  z-index: 20;
  pointer-events: none;
}
#tile-board-btn {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 8px) + 8px);
  right: 12px;
  width: 44px; height: 44px;
  background: rgba(60,60,80,0.8);
  border: 1px solid #666;
  border-radius: 8px;
  color: #fff;
  font: bold 18px monospace;
  z-index: 20;
  pointer-events: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}
#log {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 8px) + 60px);
  left: 8px; right: 8px;
  color: #ddd;
  font: 11px monospace;
  z-index: 20;
  pointer-events: none;
  text-shadow: 0 0 3px #000, 0 0 6px #000;
  max-height: 60px;
  overflow: hidden;
}
.log-line { opacity: 0.7; }
.log-line:last-child { opacity: 1; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div>
<div id="depth-label">Depth 1</div>
<div id="log"></div>
<div id="tile-board-btn">&#9638;</div>

<script>
// ============================================================
// ROGUELIKE — Web/PWA Foundation
// SPD-inspired dungeon crawler with tile board build system
// ============================================================

// --- Constants ---
const TILE = 16;           // Base tile size in pixels
const MAP_W = 32;          // Map width in tiles
const MAP_H = 32;          // Map height in tiles
const VIEW_PADDING = 4;    // Tiles of padding around viewport edges

// --- Terrain types (from SPD's Terrain.java) ---
const T = {
  WALL:         0,
  DOOR:         1,
  OPEN_DOOR:    2,
  EMPTY:        3,
  GRASS:        4,
  HIGH_GRASS:   5,
  WATER:        6,
  WALL_DECO:    7,
  ENTRANCE:     8,
  EXIT:         9,
  BOOKSHELF:    10,
  BARRICADE:    11,
  EMBERS:       12,
  PEDESTAL:     13,
  SECRET_DOOR:  14,
  TRAP:         15,
};

// Terrain passability flags
const PASSABLE = new Set([T.EMPTY, T.GRASS, T.HIGH_GRASS, T.WATER, T.DOOR, T.OPEN_DOOR, T.ENTRANCE, T.EXIT, T.EMBERS, T.TRAP]);
const BLOCKS_VISION = new Set([T.WALL, T.WALL_DECO, T.BOOKSHELF, T.BARRICADE, T.SECRET_DOOR]);

// --- Tile colors (placeholder until spritesheet rendering) ---
const TILE_COLORS = {
  [T.WALL]:        '#444455',
  [T.DOOR]:        '#8B6914',
  [T.OPEN_DOOR]:   '#6B4914',
  [T.EMPTY]:       '#2a2a3a',
  [T.GRASS]:       '#1a3a1a',
  [T.HIGH_GRASS]:  '#2a5a2a',
  [T.WATER]:       '#1a2a4a',
  [T.WALL_DECO]:   '#555566',
  [T.ENTRANCE]:    '#2a4a2a',
  [T.EXIT]:        '#4a2a2a',
  [T.BOOKSHELF]:   '#5a4020',
  [T.BARRICADE]:   '#6a5030',
  [T.EMBERS]:      '#3a2020',
  [T.PEDESTAL]:    '#3a3a4a',
  [T.SECRET_DOOR]: '#444455',
  [T.TRAP]:        '#3a2a2a',
};

// --- Game State ---
const state = {
  map: new Uint8Array(MAP_W * MAP_H),
  visible: new Uint8Array(MAP_W * MAP_H),   // FOV: currently visible
  explored: new Uint8Array(MAP_W * MAP_H),  // Tiles ever seen
  player: { x: 0, y: 0, hp: 20, maxHp: 20 },
  mobs: [],
  depth: 1,
  turn: 0,
  camera: { x: 0, y: 0 },
  scale: 3,
  log: [],
  rooms: [],
};

// --- Canvas Setup ---
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  // Calculate scale to fit ~12 tiles across the screen width
  state.scale = Math.max(2, Math.floor(canvas.width / (TILE * 12)));
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- Utility ---
function idx(x, y) { return y * MAP_W + x; }
function toXY(i) { return { x: i % MAP_W, y: Math.floor(i / MAP_W) }; }
function dist(x1, y1, x2, y2) { return Math.abs(x1 - x2) + Math.abs(y1 - y2); }
function rng(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// --- Logging ---
function log(msg) {
  state.log.push(msg);
  if (state.log.length > 4) state.log.shift();
  const el = document.getElementById('log');
  el.innerHTML = state.log.map(l => `<div class="log-line">${l}</div>`).join('');
}

// ============================================================
// DUNGEON GENERATION (simplified from SPD's builder/painter)
// ============================================================

function generateLevel() {
  const map = state.map;
  map.fill(T.WALL);
  state.rooms = [];
  state.mobs = [];
  state.visible.fill(0);
  state.explored.fill(0);

  // Generate rooms
  const roomCount = rng(6, 10);
  const rooms = [];

  // Place rooms with overlap checking
  for (let attempt = 0; attempt < 200 && rooms.length < roomCount; attempt++) {
    const w = rng(4, 8);
    const h = rng(4, 8);
    const x = rng(1, MAP_W - w - 2);
    const y = rng(1, MAP_H - h - 2);

    // Check overlap (with 1 tile padding)
    let overlaps = false;
    for (const r of rooms) {
      if (x - 1 < r.x + r.w && x + w + 1 > r.x &&
          y - 1 < r.y + r.h && y + h + 1 > r.y) {
        overlaps = true;
        break;
      }
    }
    if (!overlaps) {
      rooms.push({ x, y, w, h, cx: Math.floor(x + w/2), cy: Math.floor(y + h/2) });
    }
  }

  // Carve rooms
  for (const r of rooms) {
    for (let ry = r.y; ry < r.y + r.h; ry++) {
      for (let rx = r.x; rx < r.x + r.w; rx++) {
        map[idx(rx, ry)] = T.EMPTY;
      }
    }
  }

  // Connect rooms with corridors (nearest neighbor chain)
  const connected = [rooms[0]];
  const remaining = rooms.slice(1);

  while (remaining.length > 0) {
    let bestDist = Infinity;
    let bestC = null;
    let bestR = null;
    let bestRI = -1;

    for (const c of connected) {
      for (let i = 0; i < remaining.length; i++) {
        const r = remaining[i];
        const d = dist(c.cx, c.cy, r.cx, r.cy);
        if (d < bestDist) {
          bestDist = d;
          bestC = c;
          bestR = r;
          bestRI = i;
        }
      }
    }

    // Carve L-shaped corridor
    carveCorridor(map, bestC.cx, bestC.cy, bestR.cx, bestR.cy);
    connected.push(remaining.splice(bestRI, 1)[0]);
  }

  // Place doors at room entrances
  for (const r of rooms) {
    placeDoors(map, r);
  }

  // Scatter some water and grass
  for (let i = 0; i < map.length; i++) {
    if (map[i] === T.EMPTY) {
      const roll = Math.random();
      if (roll < 0.05) map[i] = T.WATER;
      else if (roll < 0.10) map[i] = T.GRASS;
      else if (roll < 0.12) map[i] = T.HIGH_GRASS;
    }
  }

  // Place entrance and exit
  const entrance = rooms[0];
  const exit = rooms[rooms.length - 1];
  map[idx(entrance.cx, entrance.cy)] = T.ENTRANCE;
  map[idx(exit.cx, exit.cy)] = T.EXIT;

  // Place player at entrance
  state.player.x = entrance.cx;
  state.player.y = entrance.cy;

  // Spawn mobs (1-2 per room, not in entrance room)
  for (let ri = 1; ri < rooms.length; ri++) {
    const r = rooms[ri];
    const mobCount = rng(1, 2);
    for (let m = 0; m < mobCount; m++) {
      const mx = rng(r.x + 1, r.x + r.w - 2);
      const my = rng(r.y + 1, r.y + r.h - 2);
      if (PASSABLE.has(map[idx(mx, my)])) {
        state.mobs.push({
          x: mx, y: my,
          hp: 4 + state.depth,
          maxHp: 4 + state.depth,
          atk: 1 + Math.floor(state.depth / 3),
          name: ['rat', 'gnoll', 'snake', 'crab', 'skeleton'][rng(0, Math.min(4, state.depth))],
          sprite: null, // Will load later
        });
      }
    }
  }

  state.rooms = rooms;
  updateFOV();
  centerCamera();
  log(`You descend to depth ${state.depth}.`);
}

function carveCorridor(map, x1, y1, x2, y2) {
  // L-shaped: horizontal then vertical (or vice versa, randomly)
  let cx = x1, cy = y1;
  const horiz = Math.random() < 0.5;

  if (horiz) {
    while (cx !== x2) { map[idx(cx, cy)] = T.EMPTY; cx += cx < x2 ? 1 : -1; }
    while (cy !== y2) { map[idx(cx, cy)] = T.EMPTY; cy += cy < y2 ? 1 : -1; }
  } else {
    while (cy !== y2) { map[idx(cx, cy)] = T.EMPTY; cy += cy < y2 ? 1 : -1; }
    while (cx !== x2) { map[idx(cx, cy)] = T.EMPTY; cx += cx < x2 ? 1 : -1; }
  }
  map[idx(x2, y2)] = T.EMPTY;
}

function placeDoors(map, room) {
  // Check each edge tile — if it's empty and adjacent to a wall, maybe place a door
  for (let x = room.x; x < room.x + room.w; x++) {
    for (const y of [room.y, room.y + room.h - 1]) {
      if (y > 0 && y < MAP_H - 1 && map[idx(x, y)] === T.EMPTY) {
        const above = map[idx(x, y - 1)];
        const below = map[idx(x, y + 1)];
        if ((above === T.WALL && below !== T.WALL) || (below === T.WALL && above !== T.WALL)) {
          // Check corridor connection
          if (map[idx(x, y === room.y ? y - 1 : y + 1)] === T.EMPTY) {
            map[idx(x, y)] = T.DOOR;
          }
        }
      }
    }
  }
  for (let y = room.y; y < room.y + room.h; y++) {
    for (const x of [room.x, room.x + room.w - 1]) {
      if (x > 0 && x < MAP_W - 1 && map[idx(x, y)] === T.EMPTY) {
        const left = map[idx(x - 1, y)];
        const right = map[idx(x + 1, y)];
        if ((left === T.WALL && right !== T.WALL) || (right === T.WALL && left !== T.WALL)) {
          if (map[idx(x === room.x ? x - 1 : x + 1, y)] === T.EMPTY) {
            map[idx(x, y)] = T.DOOR;
          }
        }
      }
    }
  }
}

// ============================================================
// FOV — Shadow Casting (ported from SPD's ShadowCaster.java)
// ============================================================

function updateFOV() {
  const { x: px, y: py } = state.player;
  const viewDist = 8;
  state.visible.fill(0);

  // Player's tile is always visible
  state.visible[idx(px, py)] = 1;
  state.explored[idx(px, py)] = 1;

  // Cast shadows in 8 octants
  for (let octant = 0; octant < 8; octant++) {
    castLight(px, py, viewDist, 1, 1.0, 0.0, octant);
  }
}

function castLight(cx, cy, radius, row, startSlope, endSlope, octant) {
  if (startSlope < endSlope) return;

  let newStart = startSlope;

  for (let j = row; j <= radius; j++) {
    let blocked = false;

    for (let dx = -j; dx <= 0; dx++) {
      const dy = -j;

      // Map octant to real coordinates
      let mx, my;
      switch (octant) {
        case 0: mx = cx + dx; my = cy + dy; break;
        case 1: mx = cx + dy; my = cy + dx; break;
        case 2: mx = cx - dy; my = cy + dx; break;
        case 3: mx = cx - dx; my = cy + dy; break;
        case 4: mx = cx - dx; my = cy - dy; break;
        case 5: mx = cx - dy; my = cy - dx; break;
        case 6: mx = cx + dy; my = cy - dx; break;
        case 7: mx = cx + dx; my = cy - dy; break;
      }

      if (mx < 0 || mx >= MAP_W || my < 0 || my >= MAP_H) continue;

      const leftSlope = (dx - 0.5) / (dy + 0.5);
      const rightSlope = (dx + 0.5) / (dy - 0.5);

      if (startSlope < rightSlope) continue;
      if (endSlope > leftSlope) break;

      // Mark visible if within radius
      const distSq = dx * dx + dy * dy;
      if (distSq <= radius * radius) {
        state.visible[idx(mx, my)] = 1;
        state.explored[idx(mx, my)] = 1;
      }

      const isBlocking = BLOCKS_VISION.has(state.map[idx(mx, my)]);

      if (blocked) {
        if (isBlocking) {
          newStart = rightSlope;
        } else {
          blocked = false;
          startSlope = newStart;
        }
      } else if (isBlocking && j < radius) {
        blocked = true;
        castLight(cx, cy, radius, j + 1, startSlope, leftSlope, octant);
        newStart = rightSlope;
      }
    }

    if (blocked) break;
  }
}

// ============================================================
// PATHFINDING — A* (simplified from SPD's Ballistica)
// ============================================================

function findPath(sx, sy, tx, ty, maxLen = 30) {
  if (sx === tx && sy === ty) return [];

  const open = [];
  const closed = new Set();
  const gScore = new Map();
  const parent = new Map();

  const startKey = idx(sx, sy);
  const endKey = idx(tx, ty);

  gScore.set(startKey, 0);
  open.push({ key: startKey, f: dist(sx, sy, tx, ty) });

  while (open.length > 0) {
    open.sort((a, b) => a.f - b.f);
    const current = open.shift();

    if (current.key === endKey) {
      // Reconstruct path
      const path = [];
      let k = endKey;
      while (k !== startKey) {
        path.unshift(toXY(k));
        k = parent.get(k);
      }
      return path;
    }

    closed.add(current.key);
    const { x: cx, y: cy } = toXY(current.key);

    // 4-directional neighbors
    for (const [dx, dy] of [[0,-1],[1,0],[0,1],[-1,0]]) {
      const nx = cx + dx;
      const ny = cy + dy;
      if (nx < 0 || nx >= MAP_W || ny < 0 || ny >= MAP_H) continue;

      const nKey = idx(nx, ny);
      if (closed.has(nKey)) continue;
      if (!PASSABLE.has(state.map[nKey])) continue;

      // Don't path through mobs (except the target)
      if (nKey !== endKey && state.mobs.some(m => m.x === nx && m.y === ny && m.hp > 0)) continue;

      const tentG = gScore.get(current.key) + 1;
      if (tentG > maxLen) continue;

      if (!gScore.has(nKey) || tentG < gScore.get(nKey)) {
        gScore.set(nKey, tentG);
        parent.set(nKey, current.key);
        const f = tentG + dist(nx, ny, tx, ty);
        open.push({ key: nKey, f });
      }
    }
  }

  return null; // No path
}

// ============================================================
// PLAYER ACTIONS
// ============================================================

function movePlayer(tx, ty) {
  const { player, map, mobs } = state;

  // Check if target has a mob — attack instead
  const targetMob = mobs.find(m => m.x === tx && m.y === ty && m.hp > 0);
  if (targetMob && dist(player.x, player.y, tx, ty) === 1) {
    attackMob(targetMob);
    return;
  }

  // Find path
  const path = findPath(player.x, player.y, tx, ty);
  if (!path || path.length === 0) return;

  // Move one step
  const next = path[0];

  // Check for mob in the way
  const blockingMob = mobs.find(m => m.x === next.x && m.y === next.y && m.hp > 0);
  if (blockingMob) {
    attackMob(blockingMob);
    return;
  }

  player.x = next.x;
  player.y = next.y;

  // Open doors
  if (map[idx(player.x, player.y)] === T.DOOR) {
    map[idx(player.x, player.y)] = T.OPEN_DOOR;
    log('You open the door.');
  }

  // Check exit
  if (map[idx(player.x, player.y)] === T.EXIT) {
    state.depth++;
    document.getElementById('depth-label').textContent = `Depth ${state.depth}`;
    generateLevel();
    return;
  }

  endTurn();
}

function attackMob(mob) {
  const dmg = rng(2, 5);
  mob.hp -= dmg;
  log(`You hit the ${mob.name} for ${dmg}.`);

  if (mob.hp <= 0) {
    log(`The ${mob.name} is defeated!`);
  }

  endTurn();
}

function endTurn() {
  state.turn++;
  mobTurns();
  updateFOV();
  centerCamera();
  updateHP();
  render();
}

function mobTurns() {
  const { player, mobs, map } = state;

  for (const mob of mobs) {
    if (mob.hp <= 0) continue;

    // Only act if visible to player
    if (!state.visible[idx(mob.x, mob.y)]) continue;

    const d = dist(mob.x, mob.y, player.x, player.y);

    if (d === 1) {
      // Attack player
      const dmg = mob.atk;
      player.hp -= dmg;
      log(`The ${mob.name} hits you for ${dmg}!`);
    } else if (d <= 6) {
      // Move toward player
      const path = findPath(mob.x, mob.y, player.x, player.y, 10);
      if (path && path.length > 0) {
        const next = path[0];
        // Don't step on other mobs
        if (!mobs.some(m => m !== mob && m.x === next.x && m.y === next.y && m.hp > 0)) {
          mob.x = next.x;
          mob.y = next.y;
        }
      }
    }
  }

  // Check player death
  if (player.hp <= 0) {
    log('You have been defeated...');
    setTimeout(() => {
      state.player.hp = state.player.maxHp;
      state.depth = 1;
      document.getElementById('depth-label').textContent = 'Depth 1';
      generateLevel();
      render();
    }, 1500);
  }
}

function updateHP() {
  const pct = Math.max(0, state.player.hp / state.player.maxHp * 100);
  const fill = document.getElementById('hp-fill');
  fill.style.width = pct + '%';
  fill.style.background = pct > 50 ? '#4a2' : pct > 25 ? '#a82' : '#a22';
}

// ============================================================
// CAMERA
// ============================================================

function centerCamera() {
  const { player, scale } = state;
  const tileSize = TILE * scale;
  state.camera.x = player.x * tileSize - canvas.width / 2 + tileSize / 2;
  state.camera.y = player.y * tileSize - canvas.height / 2 + tileSize / 2;
}

// ============================================================
// SPRITE LOADING
// ============================================================

const sprites = {};
const spriteQueue = [
  { name: 'warrior', src: 'assets/sprites/warrior.png' },
  { name: 'rat', src: 'assets/sprites/rat.png' },
  { name: 'gnoll', src: 'assets/sprites/gnoll.png' },
  { name: 'snake', src: 'assets/sprites/snake.png' },
  { name: 'crab', src: 'assets/sprites/crab.png' },
  { name: 'skeleton', src: 'assets/sprites/skeleton.png' },
  { name: 'tiles_sewers', src: 'assets/environment/tiles_sewers.png' },
];

let spritesLoaded = 0;

function loadSprites(callback) {
  for (const s of spriteQueue) {
    const img = new Image();
    img.onload = () => {
      sprites[s.name] = img;
      spritesLoaded++;
      if (spritesLoaded === spriteQueue.length) callback();
    };
    img.onerror = () => {
      console.warn(`Failed to load: ${s.src}`);
      spritesLoaded++;
      if (spritesLoaded === spriteQueue.length) callback();
    };
    img.src = s.src;
  }
}

// Sprite frame definitions (row, col in spritesheet)
// SPD character sprites: each frame is ~16x15, rows are animation sets
const MOB_SPRITES = {
  warrior: { w: 12, h: 15, row: 0, col: 0 },
  rat:     { w: 16, h: 15, row: 0, col: 0 },
  gnoll:   { w: 12, h: 15, row: 0, col: 0 },
  snake:   { w: 12, h: 15, row: 0, col: 0 },
  crab:    { w: 16, h: 15, row: 0, col: 0 },
  skeleton:{ w: 12, h: 15, row: 0, col: 0 },
};

// ============================================================
// RENDERING
// ============================================================

function render() {
  const { map, visible, explored, player, mobs, camera, scale } = state;
  const tileSize = TILE * scale;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Calculate visible tile range
  const startX = Math.floor(camera.x / tileSize) - 1;
  const startY = Math.floor(camera.y / tileSize) - 1;
  const endX = startX + Math.ceil(canvas.width / tileSize) + 2;
  const endY = startY + Math.ceil(canvas.height / tileSize) + 2;

  // Draw tiles
  for (let y = startY; y <= endY; y++) {
    for (let x = startX; x <= endX; x++) {
      if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) continue;

      const i = idx(x, y);
      const screenX = Math.floor(x * tileSize - camera.x);
      const screenY = Math.floor(y * tileSize - camera.y);

      if (visible[i]) {
        // Fully visible
        ctx.fillStyle = TILE_COLORS[map[i]] || '#000';
        ctx.fillRect(screenX, screenY, tileSize, tileSize);

        // Special markers
        if (map[i] === T.ENTRANCE) {
          ctx.fillStyle = '#4a4';
          ctx.fillRect(screenX + tileSize*0.3, screenY + tileSize*0.3, tileSize*0.4, tileSize*0.4);
        } else if (map[i] === T.EXIT) {
          ctx.fillStyle = '#a44';
          ctx.fillRect(screenX + tileSize*0.3, screenY + tileSize*0.3, tileSize*0.4, tileSize*0.4);
        } else if (map[i] === T.DOOR) {
          ctx.fillStyle = '#B8860B';
          ctx.fillRect(screenX + 2, screenY + 2, tileSize - 4, tileSize - 4);
        }
      } else if (explored[i]) {
        // Previously seen — darker
        ctx.fillStyle = TILE_COLORS[map[i]] || '#000';
        ctx.globalAlpha = 0.35;
        ctx.fillRect(screenX, screenY, tileSize, tileSize);
        ctx.globalAlpha = 1.0;
      }
    }
  }

  // Draw mobs
  for (const mob of mobs) {
    if (mob.hp <= 0) continue;
    if (!visible[idx(mob.x, mob.y)]) continue;

    const screenX = Math.floor(mob.x * tileSize - camera.x);
    const screenY = Math.floor(mob.y * tileSize - camera.y);

    const spriteImg = sprites[mob.name];
    const def = MOB_SPRITES[mob.name];

    if (spriteImg && def) {
      // Draw first frame from spritesheet
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(
        spriteImg,
        def.col * def.w, def.row * def.h, def.w, def.h,
        screenX + (tileSize - def.w * scale) / 2,
        screenY + (tileSize - def.h * scale) / 2,
        def.w * scale, def.h * scale
      );
    } else {
      // Fallback: colored circle
      ctx.fillStyle = '#c44';
      ctx.beginPath();
      ctx.arc(screenX + tileSize/2, screenY + tileSize/2, tileSize*0.35, 0, Math.PI*2);
      ctx.fill();
    }

    // HP bar for damaged mobs
    if (mob.hp < mob.maxHp) {
      const barW = tileSize * 0.8;
      const barH = 3;
      const barX = screenX + (tileSize - barW) / 2;
      const barY = screenY - barH - 2;
      ctx.fillStyle = '#600';
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = '#c44';
      ctx.fillRect(barX, barY, barW * (mob.hp / mob.maxHp), barH);
    }
  }

  // Draw player
  {
    const screenX = Math.floor(player.x * tileSize - camera.x);
    const screenY = Math.floor(player.y * tileSize - camera.y);

    const spriteImg = sprites.warrior;
    const def = MOB_SPRITES.warrior;

    if (spriteImg && def) {
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(
        spriteImg,
        def.col * def.w, def.row * def.h, def.w, def.h,
        screenX + (tileSize - def.w * scale) / 2,
        screenY + (tileSize - def.h * scale) / 2,
        def.w * scale, def.h * scale
      );
    } else {
      ctx.fillStyle = '#4af';
      ctx.beginPath();
      ctx.arc(screenX + tileSize/2, screenY + tileSize/2, tileSize*0.4, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

// ============================================================
// INPUT — Tap to move / attack
// ============================================================

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const { camera, scale } = state;
  const tileSize = TILE * scale;

  // Convert screen tap to tile coordinates
  const tx = Math.floor((e.clientX + camera.x) / tileSize);
  const ty = Math.floor((e.clientY + camera.y) / tileSize);

  if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return;

  // Only interact with visible tiles
  if (!state.visible[idx(tx, ty)]) return;

  movePlayer(tx, ty);
});

// ============================================================
// INIT
// ============================================================

// Register service worker for PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

loadSprites(() => {
  generateLevel();
  render();
  log('Tap to move. Tap enemies to attack.');
});

</script>
