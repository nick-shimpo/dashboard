<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Budget</title>
<style>
  :root {
    --bg: #0f1117;
    --bg-card: #1a1d27;
    --bg-card-hover: #1f2233;
    --border: #2a2d3a;
    --text: #e2e4e9;
    --text-dim: #8b8fa3;
    --text-faint: #5a5e72;
    --accent: #3b82f6;
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.15);
    --amber: #f59e0b;
    --amber-dim: rgba(245,158,11,0.15);
    --red: #ef4444;
    --red-dim: rgba(239,68,68,0.15);
    --purple: #a855f7;
    --purple-dim: rgba(168,85,247,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }

  .header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 {
    font-size: 1.15rem;
    font-weight: 600;
  }
  .header h1 span { color: var(--accent); }
  .header-meta {
    font-size: 0.75rem;
    color: var(--text-faint);
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  /* Summary cards row */
  .summary-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.5rem;
  }
  .summary-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem;
    text-align: center;
  }
  .summary-label {
    font-size: 0.65rem;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.25rem;
  }
  .summary-value {
    font-size: 1.15rem;
    font-weight: 700;
  }
  .summary-sub {
    font-size: 0.65rem;
    color: var(--text-dim);
    margin-top: 0.15rem;
  }

  /* Cycle progress bar */
  .cycle-bar {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1rem;
  }
  .cycle-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-bottom: 0.4rem;
  }
  .progress-track {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  /* Section */
  .section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .section-title {
    padding: 0.65rem 0.85rem;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }

  /* Budget row */
  .budget-row {
    padding: 0.65rem 0.85rem;
    border-bottom: 1px solid var(--border);
  }
  .budget-row:last-child { border-bottom: none; }
  .budget-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.3rem;
  }
  .budget-name {
    font-size: 0.8rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .budget-amounts {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-align: right;
  }
  .budget-amounts strong {
    color: var(--text);
    font-weight: 600;
  }
  .budget-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .budget-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  .budget-detail {
    display: flex;
    justify-content: space-between;
    font-size: 0.65rem;
    color: var(--text-faint);
    margin-top: 0.2rem;
  }
  .wallet-tag {
    font-size: 0.55rem;
    padding: 0.1rem 0.35rem;
    border-radius: 4px;
    background: var(--purple-dim);
    color: var(--purple);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* Status dot */
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .dot-green { background: var(--green); }
  .dot-amber { background: var(--amber); }
  .dot-red { background: var(--red); }

  /* Fixed costs summary */
  .fixed-summary {
    padding: 0.65rem 0.85rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .fixed-label {
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  .fixed-amount {
    font-size: 0.85rem;
    font-weight: 600;
  }
  .fixed-breakdown {
    padding: 0 0.85rem 0.65rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }
  .fixed-tag {
    font-size: 0.65rem;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  /* Warning banner */
  .warnings {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }
  .warning-item {
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    font-size: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .warning-item.over { background: var(--red-dim); color: var(--red); }
  .warning-item.caution { background: var(--amber-dim); color: var(--amber); }

  .loading {
    display: flex;
    justify-content: center;
    padding: 4rem;
    color: var(--text-dim);
  }

  .error {
    padding: 2rem;
    text-align: center;
    color: var(--red);
  }

  @media (max-width: 400px) {
    .summary-row { grid-template-columns: 1fr; }
    .header { flex-direction: column; gap: 0.25rem; align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="header">
  <h1><span>Family</span> Budget</h1>
  <div class="header-meta" id="updatedAt">Loading...</div>
</div>

<div class="page" id="page">
  <div class="loading">Loading budget data...</div>
</div>

<script>
const DATA_URL = 'data/budget-snapshot.json';

async function loadData() {
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('Failed to load');
    return await res.json();
  } catch (e) {
    console.error(e);
    return null;
  }
}

function fmtEur(n) {
  if (n == null) return '—';
  return n.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' });
}

function statusColor(s) {
  if (s === 'over_budget') return 'red';
  if (s === 'warning') return 'amber';
  return 'green';
}

function render(snap) {
  const c = snap.cycle;
  const b = snap.balance;

  // Updated timestamp
  document.getElementById('updatedAt').textContent = 'Updated: ' + fmtDate(snap.generatedAt);

  // Summary cards
  const totalBudgeted = snap.variableBuckets
    .filter(v => v.budget !== null && !v.accumulates)
    .reduce((s, v) => s + v.budget, 0);
  const totalVariableSpent = snap.summary.totalVariable;

  let html = `
    <div class="summary-row">
      <div class="summary-card">
        <div class="summary-label">Balance</div>
        <div class="summary-value">${fmtEur(b.current)}</div>
        <div class="summary-sub">EUR</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Spent</div>
        <div class="summary-value">${fmtEur(totalVariableSpent)}</div>
        <div class="summary-sub">of ${fmtEur(totalBudgeted)} budget</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Cycle</div>
        <div class="summary-value">Day ${c.daysPassed}</div>
        <div class="summary-sub">of ${c.daysTotal} days</div>
      </div>
    </div>
  `;

  // Cycle progress
  const pctColor = c.percentElapsed > 75 ? 'var(--amber)' : 'var(--accent)';
  html += `
    <div class="cycle-bar">
      <div class="cycle-labels">
        <span>Cycle start: ${snap.cycle.startDate}</span>
        <span>${c.percentElapsed}% elapsed</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${Math.min(100, c.percentElapsed)}%;background:${pctColor}"></div>
      </div>
    </div>
  `;

  // Warnings
  // Show warnings for over-budget AND for pace issues (amber/red)
  const warnings = snap.variableBuckets.filter(v =>
    v.status === 'over_budget' || v.paceStatus === 'red' || v.paceStatus === 'amber'
  );
  if (warnings.length > 0) {
    html += '<div class="warnings">';
    for (const w of warnings) {
      if (w.status === 'over_budget') {
        html += `<div class="warning-item over">&#x26A0; <strong>${w.name}</strong> is ${fmtEur(Math.abs(w.remaining))} EUR over budget</div>`;
      } else if (w.paceStatus === 'red') {
        html += `<div class="warning-item over">&#x26A0; <strong>${w.name}</strong> at ${w.paceRatio}x pace — spending too fast</div>`;
      } else if (w.paceStatus === 'amber') {
        html += `<div class="warning-item caution">&#x26A0; <strong>${w.name}</strong> at ${w.paceRatio}x pace — watch spending</div>`;
      }
    }
    html += '</div>';
  }

  // Monthly budgets
  const monthly = snap.variableBuckets.filter(v => v.budget !== null && !v.accumulates);
  if (monthly.length > 0) {
    html += '<div class="section"><div class="section-title">Monthly Budgets</div>';
    for (const v of monthly) {
      // Use pace status for color when available, fall back to budget status
      const paceCol = v.paceStatus || statusColor(v.status);
      const col = paceCol === 'red' ? 'red' : paceCol === 'amber' ? 'amber' : 'green';
      const pct = Math.min(100, v.percentUsed || 0);
      const barColor = col === 'red' ? 'var(--red)' : col === 'amber' ? 'var(--amber)' : 'var(--green)';

      let paceText = '';
      if (v.paceRatio != null) {
        if (v.paceRatio <= 1.0) paceText = 'On track';
        else if (v.paceRatio <= 1.25) paceText = `${v.paceRatio}x pace — watch it`;
        else paceText = `${v.paceRatio}x pace — slow down`;
      }

      html += `
        <div class="budget-row">
          <div class="budget-top">
            <div class="budget-name"><span class="dot dot-${col}"></span> ${v.name}</div>
            <div class="budget-amounts"><strong>${fmtEur(v.spent)}</strong> / ${fmtEur(v.budget)}</div>
          </div>
          <div class="budget-bar"><div class="budget-fill" style="width:${pct}%;background:${barColor}"></div></div>
          <div class="budget-detail">
            <span>${v.transactionCount} transactions</span>
            <span>${paceText}</span>
          </div>
        </div>
      `;
    }
    html += '</div>';
  }

  // Wallet budgets (accumulating)
  const wallets = snap.variableBuckets.filter(v => v.accumulates);
  if (wallets.length > 0) {
    html += '<div class="section"><div class="section-title">Savings Pots (accumulating)</div>';
    for (const v of wallets) {
      const col = statusColor(v.status);
      const pct = Math.min(100, v.percentUsed || 0);
      const barColor = col === 'red' ? 'var(--red)' : col === 'amber' ? 'var(--amber)' : 'var(--green)';
      html += `
        <div class="budget-row">
          <div class="budget-top">
            <div class="budget-name"><span class="dot dot-${col}"></span> ${v.name} <span class="wallet-tag">Wallet</span></div>
            <div class="budget-amounts"><strong>${fmtEur(v.spent)}</strong> / ${fmtEur(v.budget)}</div>
          </div>
          <div class="budget-bar"><div class="budget-fill" style="width:${pct}%;background:${barColor}"></div></div>
          <div class="budget-detail">
            <span>${v.transactionCount} transactions</span>
            <span>Remaining: ${fmtEur(v.remaining)}</span>
          </div>
        </div>
      `;
    }
    html += '</div>';
  }

  // Unbudgeted variable spending
  const unbudgeted = snap.variableBuckets.filter(v => v.budget === null && v.spent > 0);
  if (unbudgeted.length > 0) {
    html += '<div class="section"><div class="section-title">Other Spending</div>';
    for (const v of unbudgeted) {
      html += `
        <div class="budget-row">
          <div class="budget-top">
            <div class="budget-name">${v.name}</div>
            <div class="budget-amounts"><strong>${fmtEur(v.spent)}</strong></div>
          </div>
          <div class="budget-detail">
            <span>${v.transactionCount} transactions</span>
            <span></span>
          </div>
        </div>
      `;
    }
    html += '</div>';
  }

  // Fixed costs
  if (snap.fixedCosts.total > 0) {
    // Group fixed items by name
    const grouped = {};
    for (const item of snap.fixedCosts.items) {
      if (!grouped[item.name]) grouped[item.name] = 0;
      grouped[item.name] += item.amount;
    }
    html += `
      <div class="section">
        <div class="section-title">Fixed Costs</div>
        <div class="fixed-summary">
          <span class="fixed-label">${snap.fixedCosts.items.length} items this cycle</span>
          <span class="fixed-amount">${fmtEur(snap.fixedCosts.total)} EUR</span>
        </div>
        <div class="fixed-breakdown">
          ${Object.entries(grouped).map(([name, amt]) => `<span class="fixed-tag">${name}: ${fmtEur(amt)}</span>`).join('')}
        </div>
      </div>
    `;
  }

  // Total summary
  html += `
    <div class="section">
      <div class="section-title">Summary</div>
      <div class="fixed-summary">
        <span class="fixed-label">Variable Spending</span>
        <span class="fixed-amount">${fmtEur(snap.summary.totalVariable)} EUR</span>
      </div>
      <div class="fixed-summary" style="border-top:1px solid var(--border)">
        <span class="fixed-label">Fixed Costs</span>
        <span class="fixed-amount">${fmtEur(snap.summary.totalFixed)} EUR</span>
      </div>
      <div class="fixed-summary" style="border-top:1px solid var(--border)">
        <span class="fixed-label"><strong>Total Spent</strong></span>
        <span class="fixed-amount"><strong>${fmtEur(snap.summary.totalSpent)} EUR</strong></span>
      </div>
    </div>
  `;

  document.getElementById('page').innerHTML = html;
}

async function init() {
  const data = await loadData();
  if (!data) {
    document.getElementById('page').innerHTML = '<div class="error">Could not load budget data.</div>';
    return;
  }
  render(data);
}

init();
setInterval(init, 300000); // refresh every 5 min
</script>

</body>
</html>
