<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Side-View Terrain Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a18;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 10px;
    height: 100vh;
    overflow: hidden;
    touch-action: none;
  }
  #game {
    font-family: 'Menlo', 'Courier New', 'Consolas', monospace;
    font-size: 11px;
    line-height: 1.2;
    letter-spacing: 1px;
    white-space: pre;
    user-select: none;
    -webkit-user-select: none;
    border: 1px solid #222;
    padding: 2px;
  }
  #info {
    color: #888;
    font-family: monospace;
    font-size: 11px;
    margin-top: 6px;
    text-align: center;
    padding: 0 10px;
  }
  #controls {
    display: flex;
    gap: 4px;
    margin-top: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    background: #1a1a2e;
    color: #8888aa;
    border: 1px solid #444;
    padding: 14px 20px;
    font-family: monospace;
    font-size: 18px;
    cursor: pointer;
    border-radius: 4px;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { background: #2a2a4e; color: #aaaacc; }
</style>
</head>
<body>

<div id="game">Loading...</div>
<div id="info">Arrow keys / buttons to move. R = use rope.</div>
<div id="controls">
  <button class="btn" onclick="move(-1,0)">&#9664;</button>
  <button class="btn" onclick="move(0,-1)">&#9650;</button>
  <button class="btn" onclick="move(0,1)">&#9660;</button>
  <button class="btn" onclick="move(1,0)">&#9654;</button>
  <button class="btn" onclick="useRope()" id="ropeBtn">ROPE</button>
</div>

<script>
try {

// === WORLD CONFIG ===
const W = 48;
const H = 24;

// Terrain types
const AIR = 0, GRASS = 1, DIRT = 2, ROCK = 3, BEDROCK = 4;
const WATER = 5, CAVE_AIR = 6, TREE_TRUNK = 7, TREE_CANOPY = 8;
const ROPE_ITEM = 9, ARTIFACT = 10, VINE = 11;

// === CHARACTER & COLOR MAPS ===
const CHAR_MAP = {
  [AIR]:        '\u00B7',  // middle dot - visible sky
  [GRASS]:      '\u2581',  // ▁
  [DIRT]:       '\u2592',  // ▒
  [ROCK]:       '\u2593',  // ▓
  [BEDROCK]:    '\u2588',  // █
  [WATER]:      '\u2248',  // ≈
  [CAVE_AIR]:   '\u00B7',  // ·
  [TREE_TRUNK]: '\u2502',  // │
  [TREE_CANOPY]:'\u2663',  // ♣
  [ROPE_ITEM]:  '\u007E',  // ~ (safe ASCII fallback)
  [ARTIFACT]:   '\u25C6',  // ◆
  [VINE]:       '\u2506',  // ┆
};

const FG_MAP = {
  [AIR]:        '#1a1a33',
  [GRASS]:      '#55cc55',
  [DIRT]:       '#aa7722',
  [ROCK]:       '#8888aa',
  [BEDROCK]:    '#555566',
  [WATER]:      '#5599dd',
  [CAVE_AIR]:   '#222233',
  [TREE_TRUNK]: '#885533',
  [TREE_CANOPY]:'#33aa44',
  [ROPE_ITEM]:  '#ffcc44',
  [ARTIFACT]:   '#ff55ff',
  [VINE]:       '#44aa44',
};

const BG_MAP = {
  [AIR]:        '#080814',
  [GRASS]:      '#1a3316',
  [DIRT]:       '#331a08',
  [ROCK]:       '#1a1a28',
  [BEDROCK]:    '#0e0e18',
  [WATER]:      '#0a1a33',
  [CAVE_AIR]:   '#0a0a14',
  [TREE_TRUNK]: '#080814',
  [TREE_CANOPY]:'#0c1a0c',
  [ROPE_ITEM]:  '#1a1a0a',
  [ARTIFACT]:   '#220a22',
  [VINE]:       '#0a0a14',
};

// === GENERATE TERRAIN ===
let world = [];
for (let y = 0; y < H; y++) {
  world[y] = [];
  for (let x = 0; x < W; x++) {
    world[y][x] = AIR;
  }
}

function terrainHeight(x) {
  let h = 12
    + Math.sin(x * 0.12) * 3
    + Math.sin(x * 0.05 + 1) * 2
    + Math.sin(x * 0.25 + 2) * 1.5;
  if (x >= 34 && x <= 36) h -= 4;
  if (x >= 37) h -= 2;
  return Math.round(h);
}

// Fill terrain
for (let x = 0; x < W; x++) {
  let surface = terrainHeight(x);
  for (let y = 0; y < H; y++) {
    if (y === surface) {
      world[y][x] = GRASS;
    } else if (y > surface && y < surface + 4) {
      world[y][x] = DIRT;
    } else if (y >= surface + 4 && y < H - 1) {
      world[y][x] = ROCK;
    } else if (y === H - 1) {
      world[y][x] = BEDROCK;
    }
  }
}

// Cave system
let caveCenterY = 19;
for (let cx = 8; cx < 38; cx++) {
  let wobble = Math.sin(cx * 0.2) * 1.2;
  let r = 1.8 + Math.sin(cx * 0.15) * 0.8;
  for (let dy = -3; dy <= 3; dy++) {
    for (let dx = -3; dx <= 3; dx++) {
      let ny = Math.round(caveCenterY + wobble) + dy;
      let nx = cx + dx;
      if (ny >= 0 && ny < H && nx >= 0 && nx < W) {
        if (Math.sqrt(dx*dx + dy*dy) < r && world[ny][nx] !== AIR && world[ny][nx] !== BEDROCK) {
          world[ny][nx] = CAVE_AIR;
        }
      }
    }
  }
}

// Cave entrance shaft
let entranceX = 10;
let entranceSurface = terrainHeight(entranceX);
for (let y = entranceSurface; y <= caveCenterY; y++) {
  if (y >= 0 && y < H) {
    world[y][entranceX] = CAVE_AIR;
    if (entranceX + 1 < W) world[y][entranceX + 1] = CAVE_AIR;
  }
}

// Vines down the shaft
for (let y = entranceSurface + 1; y < caveCenterY; y++) {
  if (y >= 0 && y < H && world[y][entranceX] === CAVE_AIR) {
    world[y][entranceX] = VINE;
  }
}

// Water pool in cave
for (let x = 22; x < 29; x++) {
  let wy = caveCenterY + 1;
  if (wy < H && (world[wy][x] === CAVE_AIR || world[wy][x] === ROCK || world[wy][x] === DIRT)) {
    world[wy][x] = WATER;
  }
}

// Trees
function addTree(tx) {
  let s = terrainHeight(tx);
  if (s - 3 >= 0) {
    world[s - 1][tx] = TREE_TRUNK;
    world[s - 2][tx] = TREE_TRUNK;
    world[s - 3][tx] = TREE_CANOPY;
    if (tx - 1 >= 0) world[s - 3][tx - 1] = TREE_CANOPY;
    if (tx + 1 < W) world[s - 3][tx + 1] = TREE_CANOPY;
    if (s - 4 >= 0) world[s - 4][tx] = TREE_CANOPY;
  }
}
addTree(5); addTree(16); addTree(20); addTree(32); addTree(40); addTree(44);

// Stars
let stars = new Set();
for (let i = 0; i < 20; i++) {
  let sx = Math.floor(Math.random() * W);
  let sy = Math.floor(Math.random() * 6);
  if (world[sy][sx] === AIR) stars.add(sy * W + sx);
}

// Rope item
let ropeX = 25;
world[terrainHeight(ropeX) - 1][ropeX] = ROPE_ITEM;

// Artifact
world[caveCenterY][30] = ARTIFACT;

// Cliff face
for (let y = 8; y < 16; y++) {
  if (y < H && world[y][36] === AIR) world[y][36] = ROCK;
}

// === PLAYER ===
let player = { x: 3, y: terrainHeight(3) - 1, hasRope: false };

function isSolid(x, y) {
  if (x < 0 || x >= W || y < 0 || y >= H) return true;
  let t = world[y][x];
  return t === DIRT || t === ROCK || t === BEDROCK || t === GRASS;
}

function isWalkable(x, y) {
  if (x < 0 || x >= W || y < 0 || y >= H) return false;
  return !isSolid(x, y);
}

function isOnVine() {
  return world[player.y][player.x] === VINE;
}

function applyGravity() {
  while (player.y + 1 < H && !isSolid(player.x, player.y + 1) && !isOnVine()) {
    player.y++;
  }
}

function move(dx, dy) {
  let nx = player.x + dx;
  let ny = player.y + dy;
  if (nx < 0 || nx >= W || ny < 0 || ny >= H) return;

  if (dy < 0) {
    // Climb up
    if (isOnVine() && isWalkable(nx, ny)) {
      player.y = ny; pickup(); render(); return;
    }
    if (dx === 0 && isWalkable(player.x, ny)) {
      let wall = isSolid(player.x - 1, player.y) || isSolid(player.x + 1, player.y);
      if (wall || player.hasRope || isOnVine()) {
        player.y = ny; pickup(); render(); return;
      }
    }
    render(); return;
  }
  if (dy > 0) {
    if (isWalkable(nx, ny)) {
      player.y = ny; pickup(); applyGravity();
    }
    render(); return;
  }

  // Horizontal
  if (isWalkable(nx, ny)) {
    player.x = nx; pickup(); applyGravity();
  } else if (isWalkable(nx, ny - 1) && isSolid(nx, ny)) {
    player.x = nx; player.y = ny - 1; pickup();
  }
  render();
}

function pickup() {
  let t = world[player.y][player.x];
  if (t === ROPE_ITEM) {
    player.hasRope = true;
    world[player.y][player.x] = AIR;
    updateInfo();
  }
  if (t === ARTIFACT) {
    world[player.y][player.x] = CAVE_AIR;
    updateInfo();
  }
}

function useRope() {
  if (!player.hasRope) return;
  let deployed = false;
  for (let y = player.y + 1; y < H; y++) {
    if (isSolid(player.x, y)) break;
    world[y][player.x] = VINE;
    deployed = true;
  }
  if (deployed) {
    player.hasRope = false;
    updateInfo();
    render();
  }
}

function updateInfo() {
  let s = player.hasRope ? 'ROPE: YES' : 'ROPE: --';
  document.getElementById('info').textContent = s + ' | ' + player.x + ',' + player.y;
  document.getElementById('ropeBtn').style.color = player.hasRope ? '#ffcc44' : '#555';
}

// === RENDER ===
function render() {
  // Viewport: fit mobile width ~35 cols, 20 rows
  let viewW = 35;
  let viewH = 20;
  let camX = Math.max(0, Math.min(player.x - Math.floor(viewW/2), W - viewW));
  let camY = Math.max(0, Math.min(player.y - Math.floor(viewH/2), H - viewH));

  let html = '';
  for (let vy = 0; vy < viewH; vy++) {
    let y = camY + vy;
    for (let vx = 0; vx < viewW; vx++) {
      let x = camX + vx;
      let ch, fg, bg;

      if (x === player.x && y === player.y) {
        ch = '@';
        fg = '#ffdd00';
        bg = BG_MAP[world[y][x]] || '#080814';
      } else {
        let t = world[y][x];
        ch = CHAR_MAP[t];
        fg = FG_MAP[t];
        bg = BG_MAP[t];

        // Stars
        if (t === AIR && stars.has(y * W + x)) {
          ch = '*';
          fg = '#7788aa';
        }

        // Edge hints
        if (t === AIR || t === CAVE_AIR) {
          if (y + 1 < H && isSolid(x, y + 1)) {
            ch = '\u2581'; // ▁
            fg = (world[y+1][x] === GRASS) ? '#55cc55' : '#666677';
          }
        }
      }

      html += '<span style="color:' + fg + ';background:' + bg + '">' + ch + '</span>';
    }
    html += '\n';
  }
  document.getElementById('game').innerHTML = html;
}

// === INPUT ===
document.addEventListener('keydown', function(e) {
  switch(e.key) {
    case 'ArrowLeft':  move(-1, 0); break;
    case 'ArrowRight': move(1, 0); break;
    case 'ArrowUp':    move(0, -1); break;
    case 'ArrowDown':  move(0, 1); break;
    case 'r': case 'R': useRope(); break;
  }
  e.preventDefault();
});

let touchStartX, touchStartY;
document.addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
document.addEventListener('touchend', function(e) {
  if (touchStartX === undefined) return;
  let dx = e.changedTouches[0].clientX - touchStartX;
  let dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    move(dx > 0 ? 1 : -1, 0);
  } else {
    move(0, dy > 0 ? 1 : -1);
  }
  touchStartX = undefined;
});

// === INIT ===
updateInfo();
render();

} catch(err) {
  document.getElementById('game').textContent = 'ERROR: ' + err.message + '\n' + err.stack;
}
</script>
</body>
</html>
